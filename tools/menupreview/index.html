<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      宠物右键菜单的**预览页**（2026-10-12）。

      ## 为什么先做预览页

      用户给了 `F:\美术资源\桌宠右键菜单 UI.pdf` 要求「用这个做宠物的菜单」。
      最终形态要换掉 Electron 的原生菜单（这项目前是 `Menu.buildFromTemplate`），
      而那是个大改动：常驻置顶、点击外部关闭、多显示器定位都要自己写。

      所以**先做纯 HTML/CSS 的静态预览**：
        · 验证视觉能不能做到一模一样（截图对照设计稿）
        · 用户能直接打开看
        · 视觉定稿之后再决定怎么接进 Electron

      ## 所有数字都从 PDF 量出来（`probe-menu-metrics.py`，历史实测脚本）

      ```
      面板         300 x 437   圆角 R=14（从曲线起点 x62/y48 推出 x48+14）
      面板底       302 x 439   #eceef2（x47 y47 —— 那是 1px 描边 + 投影）
      内边距       从 x48 到内容 x54 = 6px 上下同
      行高         36
      图标         12~14px，左边缘 x66（= 54 + 12）
      文字         x90.5 起（= 66 + 图标宽 + 间隔），字号 13（字块高 12.0~12.1）
      右侧箭头     x323.74
      开关         34 x 20，右边缘 x332（= 48+300-16）
      ```
    -->
    <title>宠物右键菜单 · 设计预览</title>
    <link rel="stylesheet" href="petMenu.css" />
  </head>
  <body>
    <!--
      三栏并排 = 设计稿的三页。

      ⚠️ 设计稿的三页其实是**同一份菜单的三种状态组合**，不是三个不同菜单：
         · 第 1 页  沉浸模式开 / 聊天模式开 + 聚焦 / 允许看屏幕开
         · 第 2 页  三个全关（没有任何聚焦）
         · 第 3 页  沉浸模式关 / 聊天模式关 + 聚焦 / 允许看屏幕关

      所以下面三份 HTML 是**同构**的，只是 `data-*` 不同。
    -->
    <div class="stage">
      <!-- ═══ 第 1 页：三个都开，聊天模式聚焦 ═══ -->
      <section class="frame" data-case="p1">
        <div class="panel">
          <div class="row" data-on="true">
            <span class="ico" data-icon="moon"></span>
            <span class="label">沉浸模式（隐藏文字，只听语音）</span>
            <span class="switch" data-on="true"></span>
          </div>
          <div class="row" data-on="true" data-focus="true">
            <span class="ico" data-icon="chat"></span>
            <span class="label">聊天模式</span>
            <span class="switch" data-on="true"></span>
          </div>
          <div class="row" data-on="true">
            <span class="ico" data-icon="eye"></span>
            <span class="label">允许看屏幕</span>
            <span class="switch" data-on="true"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="paw"></span>
            <span class="label">宠物大小</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="pad"></span>
            <span class="label">桌宠控制</span>
            <span class="chev"></span>
          </div>
          <div class="sep"></div>
          <div class="row">
            <span class="ico" data-icon="mic"></span>
            <span class="label">麦克风</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="spark"></span>
            <span class="label">活泼度</span>
            <span class="value">0.60</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="memory"></span>
            <span class="label">记忆管理…</span>
          </div>
          <div class="sep" data-accent="true"></div>
          <div class="row">
            <span class="ico" data-icon="sun"></span>
            <span class="label">设置…</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="power"></span>
            <span class="label">退出</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="copy"></span>
            <span class="label">退出全部实例</span>
          </div>
        </div>
        <p class="caption">第 1 页 · 三个都「开」· 聊天模式聚焦</p>
      </section>

      <!-- ═══ 第 2 页：三个都关，没有聚焦 ═══ -->
      <section class="frame" data-case="p2">
        <div class="panel">
          <div class="row" data-on="false">
            <span class="ico" data-icon="moon"></span>
            <span class="label">沉浸模式（隐藏文字，只听语音）</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row" data-on="false">
            <span class="ico" data-icon="chat"></span>
            <span class="label">聊天模式</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row" data-on="false">
            <span class="ico" data-icon="eye"></span>
            <span class="label">允许看屏幕</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="paw"></span>
            <span class="label">宠物大小</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="pad"></span>
            <span class="label">桌宠控制</span>
            <span class="chev"></span>
          </div>
          <div class="sep"></div>
          <div class="row">
            <span class="ico" data-icon="mic"></span>
            <span class="label">麦克风</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="spark"></span>
            <span class="label">活泼度</span>
            <span class="value">0.60</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="memory"></span>
            <span class="label">记忆管理…</span>
          </div>
          <div class="sep" data-accent="true"></div>
          <div class="row">
            <span class="ico" data-icon="sun"></span>
            <span class="label">设置…</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="power"></span>
            <span class="label">退出</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="copy"></span>
            <span class="label">退出全部实例</span>
          </div>
        </div>
        <p class="caption">第 2 页 · 三个都「关」· 没有聚焦</p>
      </section>

      <!-- ═══ 第 3 页：三个都关，聊天模式聚焦（关 + 聚焦）═══ -->
      <section class="frame" data-case="p3">
        <div class="panel">
          <div class="row" data-on="false">
            <span class="ico" data-icon="moon"></span>
            <span class="label">沉浸模式（隐藏文字，只听语音）</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row" data-on="false" data-focus="true">
            <span class="ico" data-icon="chat"></span>
            <span class="label">聊天模式</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row" data-on="false">
            <span class="ico" data-icon="eye"></span>
            <span class="label">允许看屏幕</span>
            <span class="switch" data-on="false"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="paw"></span>
            <span class="label">宠物大小</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="pad"></span>
            <span class="label">桌宠控制</span>
            <span class="chev"></span>
          </div>
          <div class="sep"></div>
          <div class="row">
            <span class="ico" data-icon="mic"></span>
            <span class="label">麦克风</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="spark"></span>
            <span class="label">活泼度</span>
            <span class="value">0.60</span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ico" data-icon="memory"></span>
            <span class="label">记忆管理…</span>
          </div>
          <div class="sep" data-accent="true"></div>
          <div class="row">
            <span class="ico" data-icon="sun"></span>
            <span class="label">设置…</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="power"></span>
            <span class="label">退出</span>
          </div>
          <div class="row" data-danger="true">
            <span class="ico" data-icon="copy"></span>
            <span class="label">退出全部实例</span>
          </div>
        </div>
        <p class="caption">第 3 页 · 三个都「关」· 聊天模式聚焦</p>
      </section>
    </div>
  </body>
</html>
