<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 图标验证页：把从设计稿抠出来的 11 个 SVG 全列出来 -->
    <title>图标验证</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fff;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      img {
        /* 放大 6 倍看清形状；用 `color` 无关的黑色描边看轮廓 */
        width: 84px;
        height: 84px;
        object-fit: contain;
        background: #f6f7f9;
        border-radius: 10px;
        padding: 6px;
      }
      figcaption {
        font-size: 11px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <figure><img src="icons/moon.svg" alt="moon" /><figcaption>moon 沉浸</figcaption></figure>
    <figure><img src="icons/chat.svg" alt="chat" /><figcaption>chat 聊天</figcaption></figure>
    <figure><img src="icons/eye.svg" alt="eye" /><figcaption>eye 看屏幕</figcaption></figure>
    <figure><img src="icons/paw.svg" alt="paw" /><figcaption>paw 宠物大小</figcaption></figure>
    <figure><img src="icons/pad.svg" alt="pad" /><figcaption>pad 桌宠控制</figcaption></figure>
    <figure><img src="icons/mic.svg" alt="mic" /><figcaption>mic 麦克风</figcaption></figure>
    <figure><img src="icons/spark.svg" alt="spark" /><figcaption>spark 活泼度</figcaption></figure>
    <figure><img src="icons/memory.svg" alt="memory" /><figcaption>memory 记忆</figcaption></figure>
    <figure><img src="icons/sun.svg" alt="sun" /><figcaption>sun 设置</figcaption></figure>
    <figure><img src="icons/power.svg" alt="power" /><figcaption>power 退出</figcaption></figure>
    <figure><img src="icons/copy.svg" alt="copy" /><figcaption>copy 全部退出</figcaption></figure>
  </body>
</html>
