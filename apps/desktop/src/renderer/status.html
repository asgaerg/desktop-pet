<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP 同宠物窗口：**渲染层不联网**。状态条只显示主进程推来的文字与颜色，
      任何联网都在 Python/主进程侧做。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>桌面宠物 · 状态</title>
    <link rel="stylesheet" href="status.css" />
  </head>
  <body>
    <!--
      状态条（2026-10-11 用户要求）。

      ## 用户原话

      「联网搜索中... 这个用对话框实现，将对话框设置成可最小化，变成靠在屏幕边缘
        可拖拽的亮灯显示状态的状态条，联网搜索时灯变黄色，表示搜索中，旁边的文字
        也给变成 联网搜索中... 」

      然后收敛成：

      「不用显示头像图标，改成颜色灯，下面跟上文字就好了」
      「可拖拽只在屏幕边缘拖拽，也就是左右两边的屏幕边缘就行」

      ## 2026-10-12：按用户给的设计稿重做外观

      用户给了 `F:\美术资源\桌宠竖向状态栏.pdf` 并说
      「状态栏用这个搞，背景记得搞透明的，蓝色代表联网搜索」。

      ### 从 PDF 里量出来的精确几何（**不是目测**）

      ```
      胶囊      56 x 88 px        圆角 = 半宽（胶囊形）
      底色      #1e2229
      描边      #33383f          （PDF 里是 58x90 的一圈，比胶囊大 1px）
      灯        12 x 12 px        水平居中，距顶 14px
      文字      竖排，3 字高约 29px，y 40.8~70
      字号      约 10.5px（从文字的包围盒 10.3x29.2 反推）
      ```

      ⚠️ **56x88 而不是原来那个 17x130**：原来那个宽度是我试出来的
      （只放一个字），而设计稿给的是**完整胶囊**，所以宽度翻了 3 倍。
      主进程的 `STATUS_WIDTH` / `STATUS_HEIGHT` 必须跟着改 ——
      只改 CSS 不改主进程的话，窗口会把胶囊裁掉。

      ### 🔴 实际是**六个状态**（2026-10-16 纠正）

      ⚠️ 这里原来写的是「四个状态」，**是错的**。真相：`StatusKind` 和
      `status.css` 里一共有 **六档**，只是我上一轮只盯着其中四档核对，
      漏了 `thinking` 和 `voice`（它们一直是活的，由
      `refreshActivityStatus()` 那套计数状态机驱动）。

      | 灯色 | 文字 | `data-state` | 什么时候亮 |
      |---|---|---|---|
      | `#34c759` 绿 | 空闲 | `idle` | 没有活动 |
      | `#bf7af0` 紫 | 思考 | `thinking` | 收到 `pet.thinking` / `pet.say.start` |
      | `#2f86ed` 蓝 | 搜索 | `searching` | 工具在跑（`searchDepth > 0`） |
      | `#32ade6` 青 | 准备 | `voice` | 回合结束且 TTS 可用（要开始念了） |
      | `#ffb300` 琥珀 | 说话 | `speaking` | `voice.state === 'speaking'`（真的在播） |
      | `#e5484d` 红 | 异常 | `error` | 失败 / TTS 合成失败 |

      ⚠️ 紫和青**也带 `pulse` 呼吸动画**（和搜索的蓝一样）——
      因为都是"正在进行中"的档。空闲和异常不闪。

      ⚠️ **`listening` 是第七档，已彻底删除**（用户要求，见下）。
      所以「六档」是**删完之后剩下的**，不是把七档砍成六档另有其事。

      ### 🔵 蓝色 = 联网搜索（用户要求）

      用户明确说「蓝色代表联网搜索」。所以搜索时：灯变蓝 + 文字变「搜索」。

      ⚠️ **设计稿里蓝色本来是「说话」** —— 但用户后来改口了
      （2026-10-12）：「**说话的时候就不蓝色了，只有搜索的时候用蓝色**」。
      所以 `status.css` 里说话改成了**琥珀**，蓝色**只留给搜索**。

      ### 🔴 2026-10-16：聆听那一档**已彻底删除**

      用户原话：

      > 「**聆听就不用黄色了，宠物自己会显示，就做说话显示黄色和文字就好了**」
      > 「**彻底删除聆听**」

      删掉的东西（不是"留着不用"，是真的没有了）：

      ```
      StatusKind 里的 'listening'      删
      status.css 的 [data-state=...]   删
      statusKindFor 的 /聆听|在听|.../  删
      本文档的「聆听」那一行            删
      ```

      ⚠️ **`VoiceState.LISTENING` 没有删**，也不该删 ——
      那是**语音管线**的状态（麦克风在听），删了麦克风就不工作。
      两者名字像但是两件事：

      ```
      pet/voice.py  VoiceState.LISTENING   语音管线 —— 保留
      主进程        StatusKind             状态条显示 —— 已删这一档
      ```

      ⚠️ 这个文件头以前写过"说话 = 蓝"（设计稿原始状态），落地时被改过。
      两处不一致害人，所以在这里对齐了。
      -->
    <div id="bar" class="bar" title="拖我沿屏幕边缘上下移动">
      <div id="light" class="light" data-state="idle"></div>
      <div id="text" class="text">空闲</div>
    </div>

    <script type="module" src="status.js"></script>
  </body>
</html>
