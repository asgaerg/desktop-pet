# 书源配置模板（`config/book-sources.yaml`）
#
# ⚠️ 这个文件**只是模板**，真正生效的是 `config/book-sources.yaml`。
#    重命名后按自己的书源改。
#
# ============================================================================
# 你需要提供什么
# ============================================================================
#
# 每个书源给出 4 件事，其余都由程序处理：
#
#   ① base      站点根地址
#   ② search    怎么搜（POST 还是 GET、字段名、路径）
#   ③ toc       怎么拿目录（URL 模板 + 章节链接的正则）
#   ④ content   怎么从章节页取正文（CSS 选择器）
#
# 如果某项写错，程序**不会崩**，只会把这本书标记为"该源不可用"并换下一个源。
#
# ============================================================================
# 字段说明
# ============================================================================
#
#   name            给人类看的名字，日志里出现
#   base            根地址，末尾带 /
#   enabled         false 就跳过（方便临时停用某个源）
#   encoding        网页编码。留空 = 自动探测（推荐，中文站 GBK/UTF-8 混杂）
#
#   search:
#     method        get | post
#     path          相对路径，支持 {q} 占位符（会被 URL 编码）
#     keyword_field 搜索词的表单字段名（POST）或参数名（GET）
#     extra         额外的固定参数（可选）
#     book_link     书籍链接的正则（相对或绝对都能匹配）
#
#   toc:
#     url          目录页 URL 模板，可用 {book_id} / {book_url}
#     chapter_link 章节链接的正则
#
#   content:
#     selectors    正文容器的 CSS 选择器，**按优先级排**
#                  程序会逐个试，并且用"中文占比 + 标点密度"给候选打分
#                  取分最高的那个 —— 只靠选择器容易抓到导航栏
#     min_chars    正文最少多少字才算有效（少于它 = 这个源这本书废了，换源）
#
# ============================================================================

# 多个源按顺序尝试。第一个失败就换下一个。
sources:
  # --------------------------------------------------------------------------
  # 示例：吾读小说网（2026-10-31 实测可用，但很多书没有正文）
  # --------------------------------------------------------------------------
  - name: 吾读小说网
    base: https://www.5du5.us/
    enabled: false          # ← 默认关掉：实测多数书抓不到正文
    encoding: ''

    search:
      method: post
      path: search.html
      keyword_field: s
      book_link: '/book/[a-z0-9]+/'

    toc:
      url: '/book/{book_id}/mulu_1.html'
      chapter_link: '/book/[a-z0-9]+/[a-z0-9]+\.html?'

    content:
      selectors:
        - '#content'
        - '#chaptercontent'
        - 'article'
        - '.content'
      min_chars: 500

  # --------------------------------------------------------------------------
  # 你要加的书源，照上面这个格式写。
  # --------------------------------------------------------------------------
  #
  # - name: 我的书源
  #   base: https://example.com/
  #   enabled: true
  #   search:
  #     method: get
  #     path: 'search?q={q}'
  #     keyword_field: q
  #     book_link: '/book/\d+/'
  #   toc:
  #     url: '/book/{book_id}/'
  #     chapter_link: '/book/\d+/\d+\.html'
  #   content:
  #     selectors: ['#content', '.read-content']
  #     min_chars: 800

# ============================================================================
# 阅读行为
# ============================================================================
reading:
  # 空闲多久触发一次阅读（秒）。这里是兜底值，实际用活泼度档位的
  # `idle_after_s`（安静档 = 30 分钟），改了档位会跟着变。
  idle_after_s: 1800

  # 每次阅读读多少字（约）。太少说不出东西，太多一次读太久。
  # 1500 字中文大约 8~15 分钟阅读时间，但我们是抓取不是真读，
  # 这里指的是**读给宠物看的内容长度**。
  chunk_chars: 1500

  # 同一本书两次阅读之间至少隔多久（秒），避免一直读同一本
  same_book_cooldown_s: 7200

  # 一本书最多抓多少章就停（防止把整本盗版书下完）
  max_chapters_per_session: 1

  # 下载后校验：正文少于这么多字 = 视为"没文字"，自动换源
  min_body_chars: 500

  # 最多换几个源。全部失败就放弃这次阅读（不骚扰用户）
  max_source_retries: 3

# ============================================================================
# 社区帖子（小黑盒 / B站）—— 这类**不下载**，只读网页
# ============================================================================
community:
  enabled: true

  # 从哪些站读。`web_search` 负责找，`web_fetch` 负责读。
  sites:
    - name: 小黑盒
      query_hint: 'site:xiaoheihe.cn'
    - name: B站专栏
      query_hint: 'site:bilibili.com/read'

  # 话题池：每次随机挑一个去搜。写成你自己感兴趣的方向。
  topics:
    - '游戏杂谈 趣事'
    - '单机游戏 攻略心得'
    - '最近的游戏新闻 讨论'
    - '科幻 设定 考据'

  # 读完要不要分享给用户
  share: true
