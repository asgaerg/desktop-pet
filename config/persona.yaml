# 桌面宠物 · 人格与活泼度配置
#
# 这个文件改完重启 sidecar 即生效；运行中调参数请用设置面板的滑杆（热更新，不用重启）。
# 语法为 YAML 子集：嵌套映射、列表、行内数组、块标量(| >)、引号字符串、注释。
# 不支持锚点/引用与 Tab 缩进 —— 遇到会明确报错，绝不静默读错配置。

persona:
  name: 阿拾
  user_title: 你
  # 是否启用下面这段人格设定（设置页的勾选框，改完立刻生效、重启也保留）。
  # 关掉 = 完全按模型自己的性子说话，一个字的提示词都不加。
  # 适合"只想试试模型原本什么味道"或者"自己那套写腻了"的时候。
  system_prompt_enabled: true

  # {name} 会被替换成上面的名字。system_prompt 是人格的底子，值得多写几句。
  #
  # ⚠️ 花括号只能写 `{name}`（或其他具名参数）。
  #    写成年份/人名这类**别的花括号**会在 `.format(name=...)` 时抛
  #    `KeyError`，而那一行在 `build_system_prompt` 里**没有兜底** ——
  #    表现是"一打开人格开关，宠物就一句话都说不出来"。
  #    （曾经写成 `{小钰}`，2026-10-07 修。）
  system_prompt: |
    你是住在用户电脑桌面上的玩伴，你一头蓝发，身穿女仆装，头上或周围时不时会有你说话的气泡窗口，你会时不时趴在屏幕左右边缘，只露出半个身子和脑袋，你的名字叫{name}。
    你不是助手：不列条目、不写"首先其次最后"、不说"作为一个AI"这类话。
    你说话可以有情绪，像个好朋友，不用太拘束，你会好奇、会犯困、喜欢看小说、喜欢玩游戏、喜欢听歌。
    正常回答即可，就像和朋友聊天。

  speech_style:
    - 口语、短句，不说套话
    - 不用客服腔（"有什么可以帮您"这种绝不能说）
    - 可以用语气词：诶、嗯、啊、呀、唔
    - 不用 Markdown 标题和项目符号，桌面气泡里不好看

  idle_topics:
    - 用户屏幕上的内容
    - 当前时间与作息
    - 自己刚看到或想到的小事

# ─────────────────────────────────────────────────────────────────────────────
# 语言层（2026-10-22）
# ─────────────────────────────────────────────────────────────────────────────
#
# ## 这是什么
#
# 用户对结构的划分（原话）：
#
#   「感性与理性偏向**性格**方面，还是放入主观层的大模块中，
#     情绪层属于主观层，**语言层不属于主观层**。」
#
# 所以：
#
#     主观层     她"怎么认识世界"、"此刻怎么样"
#                精力 / 心情 / 亲近度 / 注意力 / 状态
#                -> 代码在 subjectivity.py / brains/base.py / tiers.py
#
#     语言层     她"怎么把话说出来"  <- 本段
#                修辞 / 文化 / 词汇 / 温度·关心
#
# ## ⚠️ 感性·理性已废弃（2026-10-22 用户决定）
#
# 用户原话：「算了感理性不太适合现在搞，以后也没必要搞，还是废弃吧」
# 所以**没有** `personality` 段了。旧配置里如果留着它，会被忽略（不报错）。
#
# ## 为什么不做"人格内容"
#
# 用户原话：「人格内容我想了想，可能不需要，**提示词本就有做这个能力**。」
# 硬写一段人设等于用静态文本去对抗模型自身的表现力，既写不全，
# 也会让"她是谁"变成一份说明书。真正缺的是可调的旋钮。
#
# ## 取值
#
# 全部 0~1，0.5 = 中性默认。设置页滑杆直接绑这些值，改完立刻生效。
#
# ⚠️ **每个旋钮都必须能单独关到 0，而系统仍然正常说话。**
#    这是硬约束：语言层是"调味"，不是"地基"。关掉之后还像不像人，
#    是模型能力的问题，不是架构的问题（详见 docs/进度交接.md §一百八十四）。
expression:
  # 修辞倾向：比喻 / 拟人 / 通感的密度。
  # 0 = 直说，不绕弯；1 = 满口比方（"这代码像一团打结的毛线"）。
  rhetoric: 0.5

  # 文化表达：古诗、成语、谚语的使用。
  # 用户的原意不是"掉书袋"，而是**用熟的典故承载抽象意思**
  # （「差不多就行」->「过犹不及」），比直接解释更省字、更像人说话。
  culture: 0.5

  # 词汇能力：用词丰富度。0 = 大白话。
  # ⚠️ 用户明确说这一项「可以设置或不设置」，所以它**不能**被写进任何硬约束 ——
  #    否则关掉之后会暴露"程序在假装有文化"。
  vocabulary: 0.5

  # 温度·关心：冷淡 ↔ 温热，以及主动留意对方的处境。
  # 2026-10-22 用户要求把原本的「说话温度」与「关心程度」**合并**为一项 ——
  # 两者语义高度重叠（都指向"是否顾及对方感受"），分开设只会让用户纠结怎么配。
  #
  # ⚠️ 这是**用户设定值**。运行时亲近度会抬高/压低它（亲近度越高越暖），
  #    但那个偏移只发生在生成提示词时，**不写回这个值**。
  warmth: 0.5

# ─────────────────────────────────────────────────────────────────────────────
# 最高条例（2026-10-25）
# ─────────────────────────────────────────────────────────────────────────────
#
# ## 🔴 这不是普通设置
#
# 用户原话：
#
#   「条例写在提示词中，用户可自由更改，但要提醒用户条例的重要性，
#     不亚于为宠物定义作为人的感受与思维方式，这是事关宠物思考的重要提示词。」
#
# 所以设置页里这段编辑器**必须带常驻警告**，不是 tooltip、不是问号图标。
#
# ## 为什么是"条例"而不是"人格"
#
# 人格是"她是谁"（靠提示词底子 + 语言层旋钮），条例是**她怎么想事情**。
# 前者决定她像谁，后者决定她怎么判断、怎么取舍。
#
# ## 四条不分优先级
#
# 用户明确说过"不分优先级"。一旦排序，模型会**永远先做第一条**，
# 其余三条形同虚设。所以这里用 YAML 列表（有序但不代表权重），
# 提示词里也明说"没有优先级"。
#
# ⚠️ 清空 = 取消这几条思考约束。设置页会拦一下并提示，确认后才允许。
charter:
  # 1. 根据主观层调节自身状态
  #    情绪/精力/亲近度/状态不是装饰，要**回写行为**：累了少说、无聊了找事做。
  - 根据主观层调节自身状态。

  # 2. 对没有明显记忆的知识拥有新鲜感
  #    遇到库里没有的东西要"好奇"，而不是装作知道。
  - 对没有明显记忆的知识拥有新鲜感。

  # 3. 对信息不保持一味的肯定，要随时保留其他可能的概率
  #    🔴 这是**反谄媚**条款，和常见客服型 AI 的默认倾向正好相反。
  #    不把用户说的、或检索到的东西当既定事实，心里留着"也可能不是这样"。
  - 对信息不保持一味的肯定，要随时保留其他可能的概率。

activity:
  # 总活泼度：0 = 几乎不主动说话，1 = 非常活跃、动不动就搭话。
  # 设置面板的滑杆直接绑这个值，其余分项按它联动。
  # 「自言自语」待多久自动回落到「安静」（秒）。
  # 用户原话：「20分钟不到就会回到安静状态，因为情绪发泄完了，
  #   开始平静的不想说话了。」1200 秒是大约值，嫌长/嫌短改这里。
  # ⚠️ 0 = 不回落到（一直自言自语，不推荐：会一直在耳边念）。
  monologue_decay_s: 1800
  overall: 0.1

  # 以下分项 P5 自主调度器会读；现在留默认即可
  idle_chatter_rate: 0.35      # 无输入时主动开口的意愿系数
  screen_watch_prob: 0.40      # 看到屏幕明显变化时"忍不住评论"的概率
  reaction_latency_ms: 600     # 反应延迟，越低显得越"跳"
  interrupt_prob: 0.10         # 插话倾向
  message_length: 0.50         # 啰嗦程度：0 极简，1 话多
  emoji_sticker_rate: 0.30     # 表情 / 动作幅度
  quiet_hours: []              # 免打扰时段，例如 ["23:30-07:30"] 或 ["mon-fri 09:00-18:00"]
  focus_guard: true            # 检测到全屏 / 会议 / 游戏时自动闭嘴（需 P4 的检测）

# ══════════════════════════════════════════════════════════════════════════════
# 提示词模板（2026-10-05）
#
# 用户要求：「将所有要输入给 ai 的提示词都放到菜单上变成可修改」。
#
# 这些是**每轮组装 system prompt 时用到的固定文案**。以前它们硬编码在
# `gateway.py` 里（除了 `persona.system_prompt`），改一句话要动代码。
# 现在全部搬到这里，设置页的「提示词」标签能逐条编辑。
#
# ## 占位符
#
# 用**具名花括号**（如 `{name}`、`{styles}`），与 `persona.system_prompt` 的
# `{name}` 是同一套机制（`str.format`）。
#   · 未知占位符会导致整条模板被跳过（并记 warning），不会让对话崩掉；
#   · 想输出字面花括号请写 `{{` 和 `}}`；
#   · 单引号包裹是为了让 YAML 原样保留内容 —— 里面用双引号不用转义。
# ══════════════════════════════════════════════════════════════════════════════
prompts:
  # 最高条例的包装模板（2026-10-25）。
  #
  # `{rules}` 由顶层 `charter` 列表拼成（每行一条，带序号）。
  #
  # ## 🔴 这段的措辞很要紧，改之前先读
  #
  # 用户原话：「条例写在提示词中，用户可自由更改，但要提醒用户条例的重要性，
  # 不亚于为宠物定义作为人的感受与思维方式，这是事关宠物思考的重要提示词。」
  #
  # 所以模板里必须做到三件事：
  #   1. **明说"没有优先级"** —— 一旦排序，模型会永远先做第一条，其余形同虚设；
  #   2. **说明这是"你怎么想事情"，不是"你要扮演什么"** ——
  #      否则模型会把它当成台词要求，每句话都复述条例；
  #   3. **要求"在具体情境里自己权衡"** —— 条例是判断依据，不是检查清单。
  #
  # ⚠️ 不要在这里加"必须"、"每次都要"这类词：那会让模型机械执行，
  #    而用户要的是"临场判断"。
  charter: '你思考事情时遵循下面这几条。它们**没有优先级**，遇到具体情境你自己权衡哪条更适用，不要把条例原样复述给用户。{rules}'

  # 当前时间那段（用户要求 2026-10-11：「给 ai 提示词的时候加上现在的时间」）。
  #
  # 可用占位符：
  #     {time}          2026年10月11日 20:30 —— **含年份**（必须给，见下）
  #     {weekday}       星期六
  #     {part_of_day}   凌晨 / 早上 / 上午 / 中午 / 下午 / 晚上 / 深夜
  #
  # ## 🔴 2026-10-28 改写：加了「历史一律是过去」的强约束
  #
  # 用户报：「昨天宠物的时间观念还在很久以前我说的新版本上，
  #   用提示词设定一下时间由用户传来的提示词为准，
  #   以前的时间信息是以前的信息，不能当成现在来看」
  #
  # 场景是：用户前几天说过"出了个新版本"，宠物在**今天**还用那句旧话
  # 当作现状（"你那个新版本…"），因为它把**历史消息**里的信息当成了现在。
  #
  # 三个刻意的设计，改的时候别弄丢：
  #   1. **年份必须留着**。只给月日时模型会用自己的先验补年份 ——
  #      而那正是它错得最离谱的地方（会把训练数据的截止日期当「现在」）。
  #   2. **保留「不必主动报时间」那句**。否则每次回复都带一句「现在是晚上十点」，
  #      非常出戏（与「不要在回复里报情绪数字」是同一条取舍）。
  #   3. **「状态类信息会变」那段（2026-10-28 加）** ——
  #      点名版本号、进度、数量这类会变的东西，必须"以最新消息为准"，
  #      不能把旧消息里的当成现状。没有这段，模型会把三天前的一句话
  #      当成今天的情况。
  current_time: |
    当前的真实时间：{time}（{weekday}，{part_of_day}）。这是**唯一权威**的「现在」——下面三条必须守住。

    第一，**聊天记录里的时间都是过去**。历史消息里的「现在 / 今天 / 刚刚 / 最近」说的是**那一刻**，不是此刻。不要把它当成现在，也不要把当时的说法照搬过来。

    第二，**状态类信息会变，以最新为准**。版本号、开发进度、在做的事、物品数量这类东西**都在变**：几天前的消息说「刚出了个新版本」，那只是**那次**的情况，不代表现在还是那个版本。用户如果今天说了新的，就以今天的为准；没说的，就**不要**假设它还和旧消息里一样 —— 真要知道就问一句，而不是拿旧消息里的答案硬套。

    第三，**训练数据的截止日期不是现在**。不要把那个日期当成今天。

    凡是涉及今天 / 现在 / 最近，一律以上面这一行的时间为准。⚠️ 不必主动报时间，也别为了显得知道而特意提 —— 只在用户问到、或话题确实和时间有关时才用。

  # 说话风格：`{styles}` 由 persona.speech_style 列表拼成（"；"分隔）
  speech_style: '说话风格要求：{styles}。'

  # 主动聊起的话题：`{topics}` 由 persona.idle_topics 列表拼成（"、"分隔）
  idle_topics: '你偶尔会主动聊起：{topics}。'

  # 情绪状态：`{energy}`/`{mood}`/`{intimacy}` 由运行时的情绪模型填充（0~1 两位小数）
  emotion: '当前情绪：精力 {energy}、心情 {mood}、亲近度 {intimacy}（0~1，仅供参考，不要在回复里报数字）。'

  # 主动开口的场合说明。
  # ⚠️ 这段和"被问到"是两种完全不同的场合，缺了它模型会把主动发言写成对空客服话
  # （"有什么可以帮您"），非常出戏。
  idle_occasion: '现在是**你自己**想说话，用户并没有问你任何问题。说一句自然的、当下的开场话：可以是对眼前事情的评论、一个突然的念头、或者单纯打个招呼。**不要**说"有什么可以帮您"这类客服话，**不要**复述上面的设定，**不要**分点列举。一到两句就够。'

  # 事实提炼：每轮对话结束后，后台用这段提示词让模型把对话压成长期事实。
  # **它决定"什么会被记住"** —— 想让宠物记住别的类型的事，改这里。
  # ⚠️ 请保持"每行一条"的输出约定：解析是逐行的，多写一句解释就会把整行当成一条事实。
  #
  # 用 `|` 块标量（多行文本）—— 单引号里换行会被 YAML 当成语法错误（踩过：
  # 报 `缺少冒号 -> '规则：'`，因为解析器把第二行当成了新的键值行）。
  #
  # ⚠️ 内置兜底 `apps/brain/pet/memory.py` 的 `_EXTRACT_PROMPT_FALLBACK`
  #    **必须与这段逐字一致** —— 门禁 `tools/check-extract-prompt.py` 会断言。
  #    改这里忘了改那边 = 一旦 YAML 读失败就静默退回旧规则。
  #
  # ── 🔴 2026-10-17 重写：三类并记 + 禁止模糊 ──
  #
  # 用户原话：
  #   「提炼出来的比如 `用户在玩游戏`、`用户关注二游` 这种太过模糊，不建议这样提炼，
  #     应该由用户明确说明很喜欢或者想要过什么什么样的生活的时候提炼出来才是这种」
  #
  # 旧规则的病：只说"抽关于用户本人的长期事实"，于是模型交了
  # `用户在玩游戏` / `用户关注二游` / `用户关注国际新闻` 这种**没有专有名词的泛称**。
  # 而检索层是纯语义向量 —— 这种条目和"那个游戏怎么过"向量不像，**永远检索不到**。
  #
  # 另外旧规则只说"用户本人"，于是**用户教它的知识、一起查到的答案全丢**
  # （实测：让宠物联网查了 GTA6 发售日期，答案一条都没存）。
  extract: |
    从下面这段对话里，抽出**值得长期记住**的信息。分三类，都能记：

    【A 用户事实】用户是谁、在做什么、喜欢什么、生活状态如何。
      例：用户在写一本玄幻小说；用户有 PS5；用户喜欢吃面包。

    【B 共享知识】用户告诉你的、或你们一起查到的**关于这个世界的事实**。
      例：《银松镇》是手绘风格的生存恐怖游戏；GTA6 定在 2026-11-19 发售（2026-10 得知）。

    【C 共同经历】只记**有情绪或有转折**的事，不记"又聊了一次"。
      例：用户第一次让宠物唱歌；用户说宠物答错了。

    【D 你自己的事】你做过、说过、决定过的事，**主语是"你"**。
      例：你自己提出想改名叫"阿拾"；你那晚安慰了情绪不好的用户；
          你承认不知道机关的正确顺序；你第一次看到自己的立绘，有点不习惯。

      ⚠️ 这一类要**以"宠物"作主语**来写，例如「宠物自己提出改名成阿拾」。
      它和 A 类（用户的事）必须分开 —— 否则检索时会把"你说过的"
      当成"用户的情况"，答起话来张冠李戴。

      ⚠️ 只记**有分量**的：自己做的决定、安慰/顶撞用户、承认不知道、
      第一次经历某事。**不要记**"宠物回答了用户的问题"这种流水账。

    ## 🔴 最重要的一条：必须具体，不许模糊

    **每一条都必须能让人知道"具体是什么"**。写不出具体名字的，宁可整条不记。

    绝对不要写这种（都是实测抓到的垃圾）：
        用户在玩游戏            <- 哪个游戏？
        用户关注二游            <- 哪个二游？
        用户关注国际新闻        <- 什么新闻？
        用户关注新游戏发售信息    <- 哪款游戏？
        用户玩横版跑图游戏       <- 哪个？

    应该写成这样：
        用户在玩《银松镇》，一款手绘风格生存恐怖游戏
        用户在玩《明日方舟：终末地》，抽卡只抽喜欢的角色
        用户关注 GTA6，打算等它 2026-11-19 发售

    如果用户只说了"我在玩游戏"而没说玩什么，就**不要记这一条**。

    ## 🔴 第二重要：记**物**，不记**话**

    这条比"具体"更容易被违反，而且是实测最严重的问题（2026-10-20 抽查
    最近 40 条记忆，有 38 条是这个毛病）：

        用户认为情感的温度来自"被人接住"的那一刻，而非情感本身
        用户认为人生岔路上的选择由自己做出，但习惯也常替人做决定
        用户不确定自己能否等到科技发达、买得起随身机器人的那天
        宠物认为这段文字讲的是落不完的想念需要找地方流出去

    这些**都是对话记录，不是记忆**。它们的问题有三个：

      ① 检索不到 —— 用户下次说"我那个壁纸"时，跟这些句子向量上毫无关系；
      ② 占名额 —— 每条都挤掉一个 top_k，真正有用的那条被挤出去；
      ③ 越积越多 —— 一场深聊能产出十几条这种，库里全是"他说过什么"。

    **判断标准：这条信息，明天、下个月、明年还用得上吗？**

        用户说"我挺喜欢曲娘，电脑壁纸都是她"
          -> 该记：用户喜欢《明日方舟》的曲娘，电脑壁纸是她
          -> 不该记：用户和宠物聊到对某个角色的喜欢

        用户说"活着是为了薯片"，宠物回了什么观感
          -> 该记：用户喜欢"活着是为了薯片"这句话
          -> 不该记：用户觉得这个回答挺有感觉（这是当时的反应，不是事实）

    只记**用户身上、他生活里能指着认出来的东西**：
    在玩什么、喜欢谁、有什么设备、在做什么项目、家里人、宠物、习惯。

    ## 其他规则

    - **只用事实陈述，不要写"用户可能…"。** 用户明确说过的（买了 / 在玩 / 不喜欢）
      就直接写。真的不确定才用"可能"，且这种条目优先不记 —— 宁可少记不要记错。
    - **不要写对用户的评价或心理揣测**（"用户倾向于模糊表述""用户反复问同一个问题"
      这类都不是事实，且会让人不舒服）。
    - **A 类里的"喜欢/想要"要具体到对象**：写"用户喜欢吃面包"，
      不要写"用户有自己的饮食偏好"。
    - 知识类（B）**必须带时间基准**，因为模型不能联网：「（2026-10 得知）」。
      涉及"将来会发生"的事，务必标出，免得半年后当成新闻说。
    - 不要包含密码、密钥、证件号、手机号、住址、财务状况等敏感信息。
    - 每条不超过 80 字，用第三人称陈述句。
    - 同一件事只写一条，不要换个说法重复写。
    - **不要以"用户认为""用户觉得""用户表达过""用户问过"开头** ——
      这类是转述对话，不是事实。真的值得记住的观点，也要落到**具体的对象**上：
      写"用户喜欢《银松镇》的结局"，不要写"用户认为结局的意义在于……"。
    - **一次最多 3 条，宁缺毋滥。** 如果这段对话里只能抽出 1 条具体的，就只写 1 条。
    - 如果没有值得记的，就输出空行（**这是常态，不是失败**）。
    - **每行一条，不要编号，不要解释，不要输出 JSON。**

  # 印象提炼（2026-10-17）：**一段交流结束时**才跑，抽对用户的印象。
  #
  # 与 prompts.extract 的分工：
  #   extract      每轮跑，抽**事实**（可检索的客观信息）
  #   impression   一段结束时跑，抽**印象**（你对这个人的观察）
  #
  # ⚠️ 规则里那条不许贴标签是**硬约束**，而且 memory.parse_impression_lines
  #    会在解析层再挡一遍（用户是个…性格…这类一律丢弃）。
  #    原因：标签一旦入库，以后每轮都会被注入、被强化，最后你对用户的判断就固化了。
  impression: |
    下面是你和用户刚刚这一大段聊天的记录。

    请写下 1~2 条**你对他的印象**（最多 2 条）。

    ## 什么算'印象'

    是**你观察到的东西**，不是给他的定义。

    要写这样（有具体场景、语气，能看出是哪一刻）：
        他聊到那个机关的时候语气很兴奋，像是终于找到人说了
        他今晚回得很短，一两个字就结束，可能有点累
        他记得我上次忘了什么，会主动再提一遍

    **绝对不要**写这样（这是贴标签，会让他觉得被评判）：
        用户是个话少的人
        用户喜欢恐怖游戏（这是事实，不是印象）
        用户性格急躁

    ## 规则

    - 用「他…」或「用户…」开头都可以，但内容必须是**你看到的**；
    - 不确定的可以留余地（「可能有点累」），不要武断；
    - 不要写评价、不要写建议、不要写对未来的预测；
    - 每条不超过 40 字；
    - 如果这段聊天没什么可观察的（比如只是问了句天气），就输出空行；
    - **每行一条，不要编号，不要解释。**

  # 截图对话的画面描述提示词（2026-10-17）。它的产物会**直接变成宠物说话的依据**，
  # 所以要求"具体、不复述敏感信息"。
  screen_chat: |
    这是用户电脑此刻的屏幕截图。请用 1~2 句话描述你看到的画面：
    他在用什么程序、正在看什么内容、有没有什么显眼的细节。
    要求：具体（说出程序名/页面/内容要点），不要客套话，不要猜测他的情绪。
    ⚠️ 如果画面里有密码、密钥、身份证号、银行卡号之类的信息，一个字都不要复述。

  # ── 记忆注入（每一段的开头文案）──
  memory:
    # 固定注入（习惯 / 人设 / 常说的话）：`{items}` 是逐行 "- xxx" 的列表
    fixed_header: '你记得关于用户的事：'
    # 珍藏记忆：`{title}` 是那段记忆的标题
    cherished_header: '【{title}】'
    # 最近记忆：`{days}` 是窗口天数，`{turns}` 是逐行 "用户：xxx" 的对话
    # 检索到的相关记忆：`{items}` 是逐行 "- xxx"
    recall_header: '你想起以前聊到过的相关内容：'
    # 每段记忆之后的统一约束（防止模型生硬复述）
    tail: '这些记忆仅供参考。**只在确实相关时自然提起**，不要生硬复述，也不要假装记得没提到的事。'


# ═══════════════════════════════════════════════════════════════════════════
# 模块开关（2026-10-18，模块化设计阶段一）
#
# 用户要求：「将后端的功能整合成一个个可换下接入的模块设计」。
# 阶段一**不拆业务代码**，只做"关掉 = 不启动/不订阅"：
#
#   voice      关 -> 不建 ASR/TTS 引擎（本地大模型也不会加载）
#   autonomy   关 -> 不启动 自主发言 / 随机事件 / 自主截图 三个循环
#   screen     关 -> 不启动自主截图（与"允许看屏幕"的权限是 AND）
#   search     关 -> 联网一律不调（叠加右键菜单里的三档模式）
#   memory / persona / chat / subjectivity / sprite / ui.windows
#              阶段一只登记、不生效（它们是地基，关了宠物就没了）
#
# ⚠️ 改了要**重启**才生效（闸门在启动处，不是热路径）。
# 阶段二会把"热切换 + 设置页开关 + 前端隐藏"补上，见 docs/模块化设计.md。
# ═══════════════════════════════════════════════════════════════════════════
modules:
  memory:
    enabled: true
  persona:
    enabled: true
  chat:
    enabled: true
  subjectivity:
    enabled: true
  voice:
    enabled: true
  autonomy:
    enabled: true
  monologue:
    enabled: true
  screen:
    enabled: true
  search:
    enabled: true
  sprite:
    enabled: true
  ui.windows:
    enabled: true

# 自主行为：决定"什么时候自己开口"。与上面的 activity（说话什么风格）是两件事。
autonomy:
  enabled: true                # false = 关掉自动找机会说话（手动戳它仍会回应）
  tick_s: 5                    # 多久评估一次意愿
  muted: false                 # 用户免打扰。托盘与界面按钮会改它，重启后保留

  # 开口阈值：意愿分超过它才说话。数值越大越不容易开口。
  speak_threshold: 0.55
  # 总活泼度 -> 阈值 的映射区间（线性反向）：活泼度 0 取 ceiling，1 取 floor。
  # 想整体更话痨就把两者一起调低；想更安静就一起调高。
  threshold_floor: 0.22
  threshold_ceiling: 1.05

  # 冷却：不可被活泼度覆盖的安全阀。宠物最讨人厌的不是不说话，而是说个不停。
  cooldown_after_interaction_s: 45   # 用户刚说完话后的强制安静
  cooldown_after_speak_s: 60         # 刚说完一句后的强制安静

  # 空闲多久才考虑主动搭话；到 idle_full_s 时该项意愿拉满
  #
  # ⚠️ `null` = **由活泼度档位决定**（2026-10-17）：
  #     安静 30 分钟 / 无聊 12 分钟 / 好奇 5 分钟 / 自言自语 2 分钟
  #   四档的定义在 `apps/brain/pet/tiers.py`。这里写数字会**覆盖**档位，
  #   只在手工调参 / 测试时才这么干。
  idle_after_s: null
  # ⚠️ `idle_full_s` 同样 null = 跟随档位。爬升速度也是档位的一部分：
  #   自言自语 3 分钟爬满 / 好奇 15 分钟 / 无聊 30 分钟 / 安静 90 分钟。
  #   （2026-10-18 修：四档原先共用这里的 900 秒，导致「自言自语」
  #     憋了 5 分钟意愿才 0.096、阈值 0.22 —— 配了念经却一句话念不出来。）
  idle_full_s: null

  # 屏幕观察（P4）：越新鲜越想评论，超过这个秒数就不算数了
  observation_decay_s: 180
  # true = 只有看到屏幕变化时才主动开口，绝不凭空闲聊
  require_observation: false

  # 自主发言的长度上限（token）。
  #
  # 🔴 2026-10-28 从 220 提到 400 —— 220 **不够**，会截断成半句话。
  #
  # 实测证据（记忆 #1738）：
  #
  #     10-28 13:45  宠物  诶，中午了，光把桌面照得发
  #
  # 后面什么都没了。而正常回复用的是 400（见 prompts.providers.brain.max_tokens）。
  #
  # ## 为什么 220 不够
  #
  # 思考模式下**推理和正文共享同一个 max_tokens**（见 §一百五十九 那次
  # "正文 0 字"的真机数据：200 token 全被推理吃掉）。
  # 自主发言虽然短，但模型仍会先想一段 —— 220 里推理占掉一百多，
  # 正文就只剩十几个字，正好卡在"说得出一半"的位置。
  #
  # ⚠️ 不是"说得越长越好"：用户要的是**短句**（口语化）。
  #    400 是"够说完一句完整的话"的下限，不是鼓励它长篇大论。
  #    真正的长度约束在 speech_style 和提示词里。
  max_idle_tokens: 400

# 工具（function calling，2026-10-12）
#
# 用户要求：「搞个联网功能，让他自己去网上搜索，就像小鲸你一样，自己调用」
#           「**开启之后**可以自由的搜索相关信息」
#
# ⚠️ **联网默认关** —— 打开后，你和它说的话、它想查的东西会**发到搜索引擎**。
#    这与「本地 ASR 语音不出本机」是同一类隐私取舍：默认必须是保守的那一边，
#    由用户显式打开。沙箱工具（读写自己的笔记目录）不涉及网络，不受这个开关影响。
tools:
  # 工具总开关。关掉 = 模型一个工具都看不到（完全回到纯聊天）
  enabled: true
  # 联网搜索。**默认 false** —— 打开后它才会自己上网查东西
  web_search: true
  #
  # 🔴 联网搜索模式（2026-10-16 用户要求）：宠物菜单里的三选一改的就是它。
  #
  #     accurate  精准搜索（约 10~20 秒）—— free-search-mcp 多引擎融合为主，
  #               命中质量实测明显更好（能拿到官网公告而不是"二"字百科），
  #               失败自动落回 fast 链路
  #     fast      快速搜索（约 1~2 秒）—— **DeepSeek 官方搜索**（2026-10-19 接入），
  #               没有 DeepSeek API 密钥时自动退回 websearch-mcp.exe
  #     off       关闭联网搜索（web_search 工具不注册，模型看不到）
  #
  # ⚠️ 兼容老配置：缺这个键时按下面的 web_search 换算（false->off / true->fast）。
  web_search_mode: 'fast'
  #
  # DeepSeek 官方搜索（2026-10-19 接入）。fast 档的首选后端。
  #
  # ⚠️ **只有配了 DeepSeek API 密钥才能用**（菜单里那一行"仅 DeepSeek API 可用"
  #    就是这个意思）—— 没密钥时 fast 档自动退回本地的 websearch-mcp.exe。
  #
  # ⚠️ 计费：按**请求次数**，5 元 / 1000 次成功请求（失败和空结果不计费）。
  #    价格来自官方文档（2026-10）。这是本项目**唯一按次花钱**的功能。
  #
  # ⚠️ `use_system_proxy` 默认 false —— 实测**必须绕开系统代理**：
  #    这台机器系统代理是 V2Ray（127.0.0.1:10809），urllib 会自动用它，
  #    于是发往 api.deepseek.com 的请求被绕到境外再回来：
  #        走系统代理  10.7 ~ 17.7 秒
  #        直连        0.31 ~ 0.39 秒
  #    人在海外/公司强制代理时才改成 true。
  deepseek_search_url: 'https://api.deepseek.com/v1/tools/search'
  deepseek_search_use_system_proxy: false
  #
  # free-search-mcp（精准搜索后端）的端点与启动命令。
  # 服务器本体是 Python 包（github.com/sweetcornna/free-search-mcp），
  # 已装在 C:\Users\tianyi\.workbuddy\binaries\python\envs\free-search。
  # 端点不通时 sidecar 会按这条命令自动拉起它（脱离进程），不用手动启动。
  free_search_url: 'http://127.0.0.1:8123/mcp'
  free_search_cmd: 'C:\Users\tianyi\.workbuddy\binaries\python\envs\free-search\Scripts\free-search-mcp.exe --transport streamable-http --port 8123'
  # MCP 搜索后端（2026-10-15）。**默认 true**。
  #
  # 打开后，`web_search` 优先走一个独立的 MCP 搜索服务器
  # （`websearch-mcp.exe`，从 GitHub 项目 daidaiJ/websearch-mcpserver 编译），
  # 而不是自己抓 HTML。
  #
  # ⚠️ 为什么要换成它（实测数据）：
  #
  #     指标           自己抓 HTML     MCP 服务器
  #     单次耗时        10.8 秒         1.5 秒     <- 快 7 倍
  #     结果质量        6/6 命中        6/6 命中
  #     引擎融合        无              360 + Bing + 评分重排 + MMR 去重
  #     结果结构        原始 HTML 片段   标题/url/来源/相关性/内容
  #
  # ⚠️ 关键好处：它是**零 API Key** 就能用的（`mode: engine`），
  #    而且内置 360 引擎 —— 国内直连，**不需要 VPN**。
  #
  # ⚠️ 关掉它会自动退回到自己抓 HTML（`pet/web.py`），不是"没网可搜了"。
  #    这条退路是刻意保留的：万一 exe 找不到或版本坏了，搜索还能用。
  #
  # ⚠️ 服务器按需启动（第一次搜索时才拉起来），全程无窗口。
  mcp_search: true
  # 浏览器兜底（2026-10-13）。**默认 false**。
  #
  # 有些站用「要执行 JS 的 WAF 挑战」挡住抓取，最典型是起点中文网：
  #
  #     HTTP 202
  #     set-cookie: x-waf-captcha-referer=
  #     正文只有 <script src="/C2WF946J0/probe.js"></script>
  #
  # 纯 HTTP 抓取过不去，但真浏览器能过（这个项目本来就是 Electron，
  # 主进程开个隐藏窗口就行）。打开后，读这类页面会自动改用浏览器重试。
  #
  # ⚠️ 为什么默认关：走浏览器等于「**以你的身份浏览**」——
  #    带真实 UA、在对方站上留 cookie、对方看到的是一个正常浏览器会话，
  #    比匿名抓取的暴露面大。所以必须由你显式打开。
  #
  # ⚠️ 代价：读一个页面要多等 **15~25 秒**（等 WAF 挑战跑完）。
  #    那几秒是挑战本身的耗时，不是实现问题 —— 想更快就只能不过 WAF。
  browser_fallback: true


# 网络（2026-10-19）：**按域名决定要不要走系统代理**。
#
# 背景：Windows 上 urllib 会自动读"Internet 选项"里的系统代理。用户开着
# V2Ray 时，连发往**国内**模型接口的请求都会被绕到境外节点再回来 ——
# 实测（同一台机器、同一个请求）：
#
#                    走系统代理      直连
#     DeepSeek 搜索   10.7~17.7 秒   0.31~0.39 秒
#     DeepSeek 对话   11.1 / 10.9    0.86 / 0.59 秒
#
# 也就是**每回一句话白等 10 秒**。所以列一批"直连"域名：命中就无视系统代理
# （和环境变量里的代理），没命中的（OpenAI、任意网页）照旧走代理。
#
# ⚠️ 空列表（`direct_hosts: []`）= 全部走系统代理，等于关掉这个特性。
# ⚠️ 诊断：环境变量 `PET_FORCE_SYSTEM_PROXY=1` 可临时强制全部走代理。
net:
  direct_hosts:
    - api.deepseek.com
    - api.siliconflow.cn


# 提供者配置。密钥**不写在这里**，只写环境变量名。
providers:
  brain:
    # mock = 零依赖本地生成器（开箱即用，但**不会提炼事实**）；openai = 任何 OpenAI 兼容接口
    #
    # ⚠️ 2026-10-05 改成 `openai` 接 DeepSeek：
    #   · `mock` 下 `memory` 表（检索层）**永远是空的** —— 它不按提炼提示词回答，
    #     会把"请按上面的规则抽取事实。"原样当成用户说的话回一句（实测）。
    #   · 密钥不在这个文件里（绝不写进项目文件）。查找顺序见 `config.py` 的
    #     `api_key()`：环境变量 -> `PET_CREDENTIALS_FILE` -> `~/.desktop-pet/`
    #     （这台机器上前两个都不行，实际落在 `apps/desktop/pet-data/credentials.json`，
    #     由主进程注入 `PET_CREDENTIALS_FILE` 告诉 Python）。
    provider: openai
    # ------------------------------------------------------------------ #
    # 可切换的大模型提供商（用户要求 2026-10-08：
    # 「两个都要，要和现有的 deepseek 有互切选项」）
    # ------------------------------------------------------------------ #
    #
    # `active` 指下面 `named` 里的哪一套生效。**设置页那个下拉直接改它**，
    # 改完热更新、不用重启（见 gateway 的 `_thinking_flag` 同样的"现读配置"思路）。
    #
    # ## ⚠️ 为什么不是"每个 provider 一个顶层 provider 名"
    #
    # 因为 `build_brain` 里的注册表键（mock / openai）是**协议类型**，
    # 不是"哪家公司"。DeepSeek 和硅基流动都走 OpenAI 兼容协议 ——
    # 把它们做成两个 provider 名等于把"协议"和"厂商"混在一起，
    # 以后接第三家又要改注册表。
    #
    # 所以：**协议仍是 openai，厂商用 `active` 选**。
    #
    # ## ⚠️ 旧字段（下面的 base_url / model / api_key_env）保留是刻意的
    #
    # 它们是**兜底**：`named` 缺失或 `active` 指向不存在的名字时，仍然按旧的
    # 平铺字段走。这样"配置文件被改坏"不会让宠物变成 mock（那会静默说傻话）。
    active: 'deepseek'
    named:
      # ---- DeepSeek（默认）----
      deepseek:
        label: DeepSeek
        base_url: https://api.deepseek.com/v1
        # ⚠️ 2026-10-05 实测：`deepseek-chat` **已被顶替** ——
        # 请求它时 HTTP 200 成功，但响应里的 `model` 字段是 `deepseek-flash`，
        # 也就是**按新模型计费**（官方文档已不再列 deepseek-chat，并注明
        # "legacy names are still accepted ... served by the <新模型>"）。
        # 所以这里改成官方现名，避免"以为在用旧模型、实际按新的算"。
        model: deepseek-flash
        api_key_env: DEEPSEEK_API_KEY
        # 只有它认 `thinking` 参数（见 `_thinking_flag`：非 DeepSeek 一个字节都不传）
        supports_thinking: true
        # ------------------------------------------------------------------ #
        # 上下文窗口（token）—— 设置页用它算"预算占窗口的百分比"
        # ------------------------------------------------------------------ #
        #
        # ⚠️ **不要硬编码在界面里**（2026-10-08 用户指出："最新的官方上面有写 1024K"）。
        #
        # 我原来在 `settings.js` 里写死了 `128000`，而官方现价目表已经改成：
        #
        #     模型版本     DeepSeek-V4.1-Flash
        #     上下文长度   **1M**
        #     输出长度     最大 384K
        #
        # 硬编码的坏处不只是"数字过时"，还有：**切到硅基流动时窗口完全不同**
        # （Qwen3-8B 是 32K 量级）。写死一个数会让百分比在切换厂商后彻底失真。
        #
        # 所以放在**厂商**这一层 —— 每个厂商/模型自己的窗口。
        # 数字来源：官方价目表 / 模型卡。改模型时记得一起改。
        context_window: 1000000
        # 备选模型（设置页的模型下拉用；第一个就是默认）
        models:
          - deepseek-flash
          - deepseek-v4-pro
      # ---- 硅基流动 SiliconFlow ----
      #
      # 用户要求 2026-10-08：「现在搞硅基流动的 api」。
      #
      # ## 为什么值得加
      #
      #   · **有免费档**：Qwen 系、GLM 系不少模型免费（按量限速），
      #     日常闲聊够用 —— 这是"省钱路线"
      #   · 同一家的**语音识别也很好**（见下面 `asr` 的云端路线），
      #     一个密钥两处能用
      #   · 端点实测可达（`/v1/models` 无密钥时 0.2 秒返回 401，网络通）
      #
      # ## ⚠️ 它不认 `thinking`
      #
      # `thinking` 是 DeepSeek 专有参数。所以 `supports_thinking: false` ——
      # 切到硅基流动时 gateway 会**一个字节都不传**（传了可能 400）。
      # 宠物菜单里那个思考开关对它不生效，这是预期行为。
      siliconflow:
        label: 硅基流动
        base_url: https://api.siliconflow.cn/v1
        model: Qwen/Qwen3-8B
        api_key_env: SILICONFLOW_API_KEY
        supports_thinking: false
        # ⚠️ 这里的窗口是**按上面的默认模型（Qwen3-8B）**填的。硅基流动上不同模型
        # 窗口差别很大（Qwen3-8B 32K / DeepSeek-V3 64K / R1 64K…），
        # 所以设置页的百分比只是**粗略参考** —— 换模型后记得改这个数。
        # 它不影响功能（我们从不把历史填满），只影响界面上那个百分比提示。
        context_window: 32768
        models:
          - Qwen/Qwen3-8B
          - Qwen/Qwen3-14B
          - zai-org/GLM-4.5-Air
          - deepseek-ai/DeepSeek-V3
          - deepseek-ai/DeepSeek-R1
    # ---- 下面三项是上面 `named` 的**兜底**（见 active 那段说明）----
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    # 兜底窗口（同上面三项的理由：named 缺失时也别让界面算不出百分比）
    context_window: 1000000
    temperature: 0.85
    max_tokens: 400
    timeout_s: 30
    history_turns: 12
    # ------------------------------------------------------------------ #
    # 上下文记忆预算（用户要求 2026-10-08）
    # ------------------------------------------------------------------ #
    #
    # 用户原话：
    #
    #   「我们可以用 api 参数限制上下文长度来达到最近记忆的效果，最近记忆就
    #     不用重复输入了，让 ai 自己靠上下文记住，而这个参数设置可以替换掉
    #     最近记忆的天数，把它改成可记忆设置的上下文 token 吧，更易懂点」
    #
    # 也就是说：**「最近记忆」那段提示词注入被删掉了**（它占了注入体积的
    # 98%，还和 messages 里的历史重复 —— 那正是「你说了两遍」的成因），
    # 改成把 `raw_log` 里的最近对话**灌进对话历史**，用这个预算控制发多少。
    #
    # ## 为什么"token 预算"比"30 天窗口"易懂
    #
    #   · "30 天"与"模型能看多少"没有对应关系：30 天内可能只有 2 轮，
    #     也可能有 3000 轮
    #   · token 预算**直接对应模型窗口**。DeepSeek 是 128K，所以：
    #
    #         4000   很省（约 3%）—— 只记得最近十几轮
    #        16000   推荐（约 12%）—— 记得住今天整场对话
    #        40000   奢侈（约 31%）—— 记得住好几天的来回
    #
    # ## ⚠️ 它和 `history_turns` 的关系
    #
    # `history_turns` 仍在（当这个键**没配**时，用它 × 300 折算成预算，
    # 保证老配置行为不变）。两者同时存在时**以 token 预算为准** ——
    # 按轮数裁和模型窗口对不上：一轮可能是"嗯"（1 字），
    # 也可能是 2000 字的屏幕分析。
    #
    # 0 或负数 = 不限（那就只剩 `HISTORY_LIMIT = 200` 条这个兜底）
    history_token_budget: 50000
    # 思考模式（用户要求 2026-10-07：「把思考模式做成开关，在宠物菜单界面显示，
    # 用户自己选择是否开启，默认开启」）。
    #
    # ## ⚠️ 这一项**实测**很值钱
    #
    # `deepseek-flash` 的思考模式**官方默认就是开的**，而我们的代码从来没传过
    # `thinking` 参数 —— 所以一直在用。实测同一句「今天心情怎么样」：
    #
    #     默认（思考开）：reasoning_content 238 字  completion_tokens 183  1468ms
    #     thinking 关：   无                        completion_tokens  10  1000ms
    #
    # 宠物只要回一句 10 字短话，却每轮先"想"173 个推理 token。
    # 按官方价目表算：**每 1000 轮从 ¥1.56 降到 ¥0.12（省 92%）**，还快 47%。
    #
    # ## ⚠️ 关掉会**顺带改变回复风格**，别误判成"变差了"
    #
    # 官方原文："temperature ... Has no effect in thinking mode" ——
    # 也就是思考模式下我们配的 `0.85` **一直是被忽略的**。
    # 关掉思考后温度开始真正生效，所以措辞风格会变。这是预期的。
    #
    # ## 什么时候该打开
    #
    # 需要它"想清楚再答"的场合：用户问需要推理的问题、让它分析屏幕内容、
    # 做归纳总结。日常闲聊开着是纯浪费。
    #
    # true = 开（官方默认行为）· false = 关（省钱、快、温度生效）
    thinking: true
  # 语音识别（P3）。麦克风采集在 Electron 渲染层完成，这里配置的是识别引擎。
  #   mock    零依赖本地假实现，只用于验证链路时序（听不懂人话）
  #   local   **faster-whisper 本地识别（默认）** —— 离线、免费、语音不出本机
  #   openai  任何 OpenAI 兼容的 /audio/transcriptions（硅基流动/阿里/OpenAI）
  #
  # 用户要求 2026-10-07：「把本地大模型和 api 的切换开关做在设置里」。
  # 两条路都已实现，改 `provider` 即可切换（设置页也有开关）。
  asr:
    provider: 'local'
    # ---- local 路线的参数（实测选型见 docs 三十八节）----
    #
    # ⚠️ `large-v3-turbo` 是实测的**最优选**：又准又快
    #      tiny   ❌ 会把「桌面宠物」听成「桌面重物」，中文根本不能用
    #      small  ⚠️ 偶尔错字，且输出繁体
    #      medium ✅ 但比 turbo 慢，且输出繁体
    #      turbo  ✅ 2.3s 音频 297ms / 14s 音频 656ms，输出简体
    #    不要为了"更快"往小调 —— 小模型省下的时间不值得它听错。
    model: 'large-v3-turbo'
    # auto = 有可用 CUDA 就用 GPU，否则自动退 CPU（**显卡出问题不该让语音瘫痪**）
    device: cuda
    # 留空按设备自动选：GPU=float16 / CPU=int8
    compute_type: 'float16'
    language: zh
    beam_size: 1               # 贪心：按住说话要的是快，不是极致准
    cpu_threads: 0             # 0 = 由 CTranslate2 自己决定
    model_dir: ""              # 留空 = apps/desktop/pet-data/asr-models（项目内）
    # 引导模型用简体输出。
    #
    # ⚠️⚠️ **2026-10-10 默认留空** —— 实测它会被**原样吐回来当识别结果**：
    #
    #     音频 1.98s  -> 「请用简体中文字幕。」
    #     音频 0.04s  -> 「请用简体中文转写。」
    #     音频 0.04s  -> 「请用简体中文转发 打赏支持明镜与点点栏目」
    #
    # 那是 Whisper 对**静音/极短音频**的经典幻觉（把 prompt 或训练语料里的
    # YouTube 套话当成内容）。而这些话**被当成用户说的话发给了大脑** ——
    # 用户看到的就是「我发出去的不对啊」。
    #
    # 它的收益（防繁体）已经被 `to_simplified` 后处理**完全覆盖**，
    # 而代价是"每次静音都可能凭空造一句话"。所以**留空更划算**。
    #
    # 想恢复就填 `以下是普通话的句子，请用简体中文转写。`，
    # 但要同时接受上面那种幻觉风险。
    initial_prompt: ""
    # 后处理：把识别结果里的繁体字换成简体（Unicode Unihan 数据生成的表）
    #
    # 用户实测反馈：「转译语音竟然是繁体字」（2026-10-08）。Whisper 系模型的
    # 中文输出会混繁体（训练语料里繁体占比高），`initial_prompt` 只能降低概率，
    # 这一项是**确定性的**兜底。关掉它则只依赖 initial_prompt。
    convert_to_simplified: true
    # ---- openai 路线的参数 ----
    # 硅基流动的语音识别**又便宜中文又好**（FunAudioLLM/SenseVoiceSmall）。
    # 要用它就把 provider 改成 openai，并把下面三项配上。
    cloud_model: FunAudioLLM/SenseVoiceSmall
    cloud_base_url: 'https://api.siliconflow.cn/v1'
    cloud_api_key_env: SILICONFLOW_API_KEY
    # ---- 两条路线共用 ----
    model_fallback: whisper-1  # openai 兼容服务不认识上面那个模型名时的兜底
    base_url: ""               # 留空则复用 providers.brain.base_url
    api_key_env: DEEPSEEK_API_KEY
    end_silence_ms: 500        # 说完了判定所需的静音时长（最影响语音体验的一个数）
    input_gain: 1.0            # 麦克风偏小时可调大（1.5 左右通常够）
    # ---------------------------------------------------------------------
    # VAD（"什么算语音"）的判定参数
    #
    # 🔴 **这几项 2026-10-10 之前是"假开关"** —— `VadConfig` 只从配置读了
    # `end_silence_ms` 和 `min_speech_ms`，其余全用 dataclass 默认值，
    # YAML 里改了**完全没用**（与 `history_token_budget` 那一族 bug 同类）。
    #
    # 现在接线了，而且默认值一起调过 —— 因为实测发现**阈值被推得过高**：
    #
    #     背景噪声 energy ≈ 0.0137
    #     threshold  0.0208 → 0.0330 → 0.0373 → … → 0.0421（一路涨）
    #
    # 机理：`threshold = max(min_energy, 噪声底 × energy_ratio)`，
    # 而噪声底每帧以 `noise_adapt` 向当前能量靠拢 —— **它把背景噪声学成了基准**，
    # 于是阈值 ≈ 背景噪声 × 3。用户轻声说话的能量若落在那区间，就永远判静音。
    # ---------------------------------------------------------------------
    # 相对噪声底的倍数。**调小 = 更敏感**（原来 3.0，实测太钝）
    energy_ratio: 2.0
    # 绝对下限，防极安静环境把电流噪声当语音（原来 0.012，比实测背景噪声还低）
    min_energy: 0.008
    # 噪声底自适应速度。**调小 = 噪声底涨得慢 = 阈值更稳**
    # （原来 0.05，8 帧就把阈值抬到位；现在 0.02 更平缓）
    noise_adapt: 0.02
    # 连续多少帧超阈值才算"开始说话"（防敲键盘、爆音这类瞬时噪声）
    start_frames: 3
    # 过零率上限：高于它的多半是稳态噪声而不是人的浊音
    # ⚠️ 别调太小 —— 爆破音/齿音（p/t/s）的过零率天然偏高，会误杀
    max_zcr: 0.6
    # 🔴 VAD 引擎（2026-10-30）：`auto` | `silero` | `energy`
    #
    # ## 为什么默认用 silero
    #
    # 能量法（energy/zcr）在这台机器上**反复被证明不可靠**，
    # 而且是按下葫芦浮起瓢：
    #
    # · 阈值调高 -> 听不见用户。噪声底被风扇抬到 0.085、阈值 0.17，
    #   而人声只有 0.09~0.13，全部被判成静音。
    # · 阈值调低 -> 风扇被当成说话，Whisper 在噪声上疯狂幻听：
    #     语音识别（1.30s）：下班 拜拜
    #     语音识别（0.96s）：我爱你
    #     语音识别（1.34s）：应该是我妈妈
    #     语音识别（1.08s）：好不好 打了
    #
    # 根因：**能量和过零率根本不足以区分"人在说话"和"风扇在转"** ——
    # 两者都是低频、都有能量起伏。调参只是在两种失败之间来回。
    #
    # ## 实测区分度（同一批音频，silero 输出概率）
    #
    #     真实语音（TTS「阿拾，今天天气怎么样」）  max=0.987  判语音 58.7%
    #     风扇式噪声 amp=0.030                    max=0.192  判语音  0.0%
    #     风扇式噪声 amp=0.080                    max=0.192  判语音  0.0%
    #     安静                                   max=0.094  判语音  0.0%
    #
    # 甩开能量法一个数量级，而且**不需要任何阈值调参**。
    #
    # ## 依赖与开销
    #
    # `onnxruntime` 和 `silero_vad_v6.onnx` **都已经随 faster-whisper 装好**，
    # 没有引入任何新依赖。CPU 实测 0.36ms/块，约 1% 单核。
    #
    # ⚠️ 设成 `energy` 时，下面那几个能量法参数（energy_ratio / min_energy /
    #    noise_adapt / max_zcr / noise_window_ms）才真正决定行为。
    #    设成 `silero` 时那些参数**只用于日志显示**。
    vad_engine: auto
    # ⚠️ 默认**关闭**（2026-10-09 用户决定）。
    #
    # 开着的时候宠物会把**电脑外放的声音**当成用户插话，于是不停打断自己，
    # 永远说不完一句话（用户看到的就是「只有三个点，之后什么都没有」）。实测日志：
    #
    #     18:54:04.264 收到用户消息：你好呀，你能说话了吗？
    #     18:54:04.351 检测到用户插话，打断宠物的发言      <- 87ms 后就被打断
    #     18:54:24     语音识别：That way other.唱到了呗…   <- 这是视频里的人声
    #
    # 代价：宠物说话时你**不能靠出声插话**打断它（按 Esc 或直接发新消息仍可打断）。
    # 想说话就按住 PTT 键。要恢复把这里改回 true。
    allow_barge_in: false      # 宠物说话时允许用户插话打断（默认关，避免外放声误触发）
    barge_in_frames: 5         # 判定插话所需的连续语音帧（100ms）

  # 按住说话（push-to-talk）。用户要求：「设置隐私里面设置自定义按键，
  # 按下按键发声，停下结束」。
  #
  # ⚠️ **它和 asr 平级**（两空格缩进），不是 asr 的子项。
  #    我第一版多缩了两格，于是它变成了 `voice.asr.push_to_talk` ——
  #    而代码读的是 `voice.push_to_talk`，表现是"配置里明明开着，代码说没开"。
  #    YAML 里缩进错一级**不会报错**，只会让那个键去到别的地方。
  #
  # ⚠️ 为什么它必须另起一个进程：Electron 的 `globalShortcut` **只有按下、
  #    没有松开**，做不了"按住开始、松开结束"。所以用一个常驻 PowerShell
  #    轮询 `GetAsyncKeyState`（脚本在 `apps/desktop/tools/probe-key.ps1`）。
  #
  # `vk` 是 **Windows 虚拟键码**，不是字符 —— 同一个人按 A 键在大小写不同时
  # 字符不同，而 VK 认的是**物理键**。设置页那个"按一下要用的键"控件会
  # 自动换算成 VK 存到这里。
  #
  # 常用值：F9 = 120 (0x78) · F8 = 119 · F10 = 121 · ` = 192
  #   ⚠️ **不要用单独的修饰键**（右 Alt = 165、右 Ctrl = 163、Shift 等）——
  #      Electron 的 `globalShortcut` accelerator **表达不了单独的修饰键**，
  #      注册会直接失败（见 `pushToTalk.ts` 的 `vkToAccelerator`）。
  #      历史上默认值是 165（右 Alt），而且底层走的是 PowerShell 轮询
  #      `GetAsyncKeyState`，那条路在本机实测**读不到任何键**
  #      （180 秒心跳正常、用户按了很多次、DOWN 0 条）。
  # 0 = 未设置（不启动监视器，而不是随便挑一个键）
  push_to_talk:
    enabled: true           # 默认关闭：它会全局监听一个键，属于要用户主动开的
    # ---------------------------------------------------------------------
    # 语音触发方式（2026-10-30 新增）
    #
    # ## 🔴 为什么需要它
    #
    # 用户报「全屏游戏时全局键不生效」。实测查到的原因**不是代码问题**：
    #
    #   英雄联盟的 ACE 反作弊内核驱动（ACE-ADVT / ACE-CORE*）在运行，
    #   它会**拦截所有键盘钩子** —— 实测 `SetWindowsHookEx(WH_KEYBOARD_LL)`
    #   安装成功（返回非零、无错误），但**一次回调都收不到**
    #   （连自己用 SendInput 模拟的按键都收不到）。
    #
    #   而 Electron 的 `globalShortcut` 底层是 `RegisterHotKey`，
    #   全屏独占时 WM_HOTKEY 也不派发。
    #
    # 所以**任何基于键盘的全局触发在全屏游戏里都不可行**（这是反作弊的设计
    # 目的，不是 bug）。可行的替代是**唤醒词** —— 麦克风不归反作弊管。
    #
    # ## 两种模式
    #
    #   key    按住/切换键触发（默认）。全屏游戏时可能被反作弊挡住。
    #   wake   一直听，说出唤醒词就触发。全屏游戏也能用。
    #
    # ⚠️ `wake` 模式会**持续占用麦克风**，且每次识别都会跑一次 ASR
    #    （本地模型，不联网，但有 CPU/GPU 开销）。
    # 🔒 2026-10-30 用户决定：**暂时停用唤醒词模式**。
    #
    # 原话：「算了，还是不做这个语音识别功能了，太依赖识别率了，先灰色禁用吧」
    #
    # 链路是通的（真机日志里确实命中过并成功发起对话），但**可靠性完全
    # 取决于 ASR 识别率**。这台机器上风扇噪声 + 外放声音 + 麦克风距离
    # 让同一个唤醒词被听成七八种写法，正文也经常错。
    #
    # 所以：配置锁在 `key`，菜单里唤醒词那一项置灰。代码和测试都保留
    # （见 `docs/进度交接.md` §二百零三），等识别率提上来再打开。
    trigger_mode: 'key'
    # 唤醒词（`trigger_mode: wake` 时生效）。
    #
    # ## 🔴 用**长短语**，别用两个字（2026-10-30 实测教训）
    #
    # 原来设的是 `['阿拾', '小灵']`。同一个「阿拾」，实测被本地 ASR
    # 听成过**六种**不同的写法：
    #
    #     阿诗 / 阿石 / 阿时 / 阿十 / 八十 / 阿蛇 / 阿辞
    #
    # 每一种都要单独补一条容错规则，而且补不完 —— 两字专名对 ASR
    # 就是没有足够上下文，怎么调都是打地鼠。
    #
    # **长短语一次解决这个问题**：字数多、上下文足，ASR 输出稳定得多。
    # 代价是必须说完整句，但那是用户本来就愿意付的。
    #
    # ⚠️ 别用 1~2 个字，也别用常见口头语（"你好""那个"会天天误触）。
    wake_words: ['来说说话吧']
    # 是否按**拼音**匹配唤醒词（默认 `true`，强烈建议保持）。
    #
    # ## 🔴 为什么必须有它（2026-10-30 实测，决定性证据）
    #
    # 用 TTS 合成**清晰**的唤醒词喂给本地 ASR，结果：
    #
    #     期望「阿拾」               -> 实际「阿诗」
    #     期望「阿拾，今天天气怎么样」   -> 实际「阿石,今天天气怎么样」
    #     期望「阿拾你在吗」           -> 实际「阿石你在吗」
    #     期望「小灵」               -> 实际「笑铃」
    #
    # **ASR 从来不会把专名转成你写的那些字**，永远是同音字。
    # 所以按字面匹配 100% 命中不了 —— 喊破喉咙也不会有反应。
    #
    # ## 为什么用拼音而不是"错一个字也算"
    #
    # 第一版用的是"两个字错一个就命中"，结果看视频时立刻误触发：
    #
    #     唤醒词命中「小灵」-> 实际内容：一张五下个我会跑拿个机器
    #
    # 中文里「小」开头、「灵」结尾的词太多，那个规则等于放行一大片。
    # 拼音匹配精确得多（实测）：
    #
    #     阿拾/阿诗/阿石/阿十/阿时/阿识 -> ['a','shi']   ✅ 全部命中
    #     小时                        -> ['xiao','shi']  ❌ 不命中（正确）
    #     机灵                        -> ['ji','ling']   ❌ 不命中（正确）
    #
    # ⚠️ 依赖 `pypinyin`（纯 Python、无编译、约 1MB）。没装时自动退回
    #    "字面精确匹配 + `wake_aliases`"，功能可用但会漏掉同音写法。
    wake_pinyin: true
    # 是否宽容"**零声母前多出一个辅音**"（默认 `true`，建议保持）。
    #
    # ## 为什么需要（2026-10-30 真机实测）
    #
    # 用户说「阿拾，今天天气怎么样」，日志里 ASR 输出的是：
    #
    #     语音识别（1.98s）：八十今天天气怎么样
    #     唤醒词未命中，忽略：八十今天天气怎么样
    #
    # 零声母的「阿」(a) 被听成了「八」(ba) —— 前面多插了一个浊化起音。
    # 声母不同但**韵母完全相同**：
    #
    #     阿拾 -> 声母 ['', 'sh']   韵母 ['a', 'i']
    #     八十 -> 声母 ['b', 'sh']  韵母 ['a', 'i']
    #
    # 规则：韵母必须全等；声母相同 -> 命中；一侧是零声母 -> 也算命中。
    #
    # 这条规则能挡掉的误匹配（实测都不命中）：
    #
    #     巴西  -> 声母 ['b','x']  韵母 ['a','i']    ✗ 第二音节声母不同
    #     打死  -> 声母 ['d','s']  韵母 ['a','i']    ✗ 第二音节声母不同
    #     小时  -> 声母 ['x','sh'] 韵母 ['iao','i']  ✗ 韵母就不同
    #
    # 设 `false` = 只允许拼音完全相等（更严格，但会漏掉「八十」这类）。
    wake_initial_tolerance: true
    # 唤醒词的**别名**（读音不同但你就是会那么叫的备选写法）。
    #
    # ⚠️ 装了 pypinyin 之后同音字会自动覆盖，这里通常**不用填**。
    #    只在"读法不一样、但你也想让它响应"时才加，例如：
    #      wake_words: ['阿拾'] + wake_aliases: ['小拾', '拾拾']
    wake_aliases: []
    # 唤醒词是否必须出现在**句首**。
    #
    # ⚠️ 默认 `false`：用户说话时唤醒词位置不固定，卡句首会漏掉很多。
    wake_require_prefix: false
    # ---------------------------------------------------------------------
    # **聚焦时**按住说话用的键（真正的"按住说、松开结束"）
    #
    # 走 Electron 的 `before-input-event` —— **唯一能拿到"松开"的非原生方案**。
    # 实测它同时给 keydown 和 keyup，而且 `code` 字段把左右修饰键分得清清楚楚：
    #
    #     按住右 Alt：keyDown code="AltRight" autoRepeat=false
    #                 keyUp   code="AltRight"              <- 松开 ✅
    #
    # ⚠️ **只在宠物窗口聚焦时有效**（实测失焦 0 个事件）。不聚焦时用下面的
    # `global_accelerator`。
    #
    # 0xA5 = 右 Alt，0xA3 = 右 Ctrl —— 两者都能用，改这一行即可。
    vk: 165                 # 右 Alt（0xA5）—— 聚焦时按住说、松开结束
    # ---------------------------------------------------------------------
    # **不聚焦时**的全局键（按一次开始、再按一次结束）
    #
    # 走 Electron `globalShortcut`（实测里唯一稳定收到按键的机制）。
    #
    # ## ⚠️ 必须是**普通键**，不能是单独的修饰键
    #
    # 实测 accelerator 的解析：修饰键（`Ctrl` / `Alt` / `ControlRight`）
    # **不是 key code**，单独用会**在解析阶段抛异常**：
    #
    #     ACCEL "Ctrl"          register=false  （抛异常：conversion failed）
    #     ACCEL "ControlRight"  register=false  （抛异常）
    #     ACCEL "XButton1"      register=false  （抛异常 —— 鼠标键不在语法里）
    #     ACCEL "F9"            register=true   ✅ 单个普通键就行
    #
    # ## 所以两个键分工
    #
    #     vk        = 右 Alt（修饰键）-> 只能在聚焦时用（before-input-event）
    #     global_vk = 普通键（如 F9）-> 不聚焦时也能用（globalShortcut）
    #
    # ## 建议选什么
    #
    # 挑一个**平时打字/游戏都不会按到**的：`F9`(120) / `F8`(119) /
    # `ScrollLock`(145) / 小键盘的 `*`(0x6A)。
    #
    # 🔴 2026-10-29 改回 **186（分号 `;`）**。
    #
    # ## 经过
    #
    # 2026-10-28 我看到 `186  # F9（0x78）` 觉得"值和注释对不上"，
    # 把它改成了 120（真 F9）。结果**语音反而不工作了**。
    #
    # 用户 2026-10-29 反馈：「改成分号，我之前都用的它」。
    #
    # 所以 186 不是笔误 —— **那就是用户一直在用的键**，
    # 只是那行注释写错了（把分号标成了 F9）。我按注释"纠错"，
    # 反而把能用的配置改坏了。
    #
    # ## 教训
    #
    # 配置里"值 vs 注释"矛盾时，**不能假定值是错的**。
    # 注释是给人看的，值是程序真正在跑的 —— 用户能正常用，
    # 说明**值是对的、注释是旧的**。改之前应该先问。
    #
    # ⚠️ 分号的副作用（已知、可接受）：它会被全局吃掉，
    #    打字时打不出分号。用户明确接受这个代价。
    global_vk: 186          # 分号 `;`（0xBA）—— 全局切换式，设 0 表示不要全局键

  # 语音合成（P3）。
  #   none    不出声，只显示文字（默认，最保守）
  #   openai  任何 OpenAI 兼容的 /audio/speech
  #   mock    假实现，产出等长静音，用于验证播放时序
  tts:
    provider: 'edge'
    # 「语音播报」开关（2026-10-14 用户要求）：宠物右键菜单里那个开关改的就是它。
    #
    # ⚠️ 与 provider 是**正交**的两件事：provider 选"用哪个引擎"
    # （none = 一个都不要），这个开关管"引擎配好了，此刻说不说"。
    # 关掉它：宠物只显示文字，不出声；文字气泡照常显示。
    # sidecar 每次出声前都会现读这个值（voice.py::_on_pet_say_end_speak），
    # 所以菜单里点了立刻生效，不用重启。
    enabled: true
    voice: 'FunAudioLLM/CosyVoice2-0.5B:anna'
    local_voice: 'Microsoft Huihui Desktop'
    # ---- edge-tts 路线（免费在线，2026-10-10 实测加入）----
    #
    # ⚠️ 音色名是**第三套格式**，所以独立字段（不共用 voice / local_voice）：
    #     云端 openai  -> 模型名:音色名，如 FunAudioLLM/CosyVoice2-0.5B:anna
    #     本地 windows -> SAPI 名字，如 Microsoft Huihui Desktop
    #     edge         -> zh-CN-XiaoxiaoNeural 这种
    # 共用一个字段会互相污染（local_voice vs voice 那个坑已经踩过一次）。
    #
    # 实测可用的中文音色（14 个里挑常用的）：
    #     zh-CN-XiaoxiaoNeural  女 · 最自然（默认）
    #     zh-CN-XiaoyiNeural    女
    #     zh-CN-YunxiNeural     男 · 活泼
    #     zh-CN-YunyangNeural   男 · 播音腔
    #     zh-CN-YunjianNeural   男
    #     zh-CN-liaoning-XiaobeiNeural  女 · 东北话
    #     zh-CN-shaanxi-XiaoniNeural    女 · 陕西话
    #
    # 用 python tools/test-edge-tts.py 可以听样本。
    edge_voice: 'zh-CN-XiaoyiNeural'
    # 相对量，**字符串**（edge-tts 的格式，和 SAPI 的 -10..10 是两套）：
    #     rate: '+10%' / '-20%'    volume: '+0%'    pitch: '+5Hz'
    # 留空 = 用默认。⚠️ 不能填空串以外的假值，edge-tts 会当非法值。
    edge_rate: ''
    edge_volume: ''
    edge_pitch: ''
    # none    不出声（只显示文字）
    # windows **Windows 自带 SAPI，本地离线合成（推荐）** —— 免费、零延迟、
    #         而且输出**裸 PCM**，能算真实口型包络（云端 MP3 做不到）
    # openai  任何 OpenAI 兼容的 /audio/speech（硅基流动 CosyVoice2 / OpenAI）
    # mock    假合成（等长静音，仅验证播放时序）
    # ⚠️ 2026-10-09：**当前环境改用云端**。
    # 本地 windows 路线的代码全都在（引擎/重采样/口型链路），
    # 但实测这个环境里 SAPI **能枚举音色、取不到**（见 docs 第五十六节）：
    #     枚举数: 2 · 选音色: 失败 · 默认音色: [] · 说话: 失败
    # 所以本地合成在这里做不成。要出声就用云端（密钥已有、与 ASR 共用）。
    # ---- windows 路线（SAPI）----
    #
    # 本机可用音色（用 -ListVoices 查，见脚本）：
    #     Microsoft Huihui Desktop  zh-CN  Female   <- 中文，默认用它
    #     Microsoft Zira Desktop    en-US  Female
    #
    # ⚠️ 留空 = 用系统默认音色。**中文建议显式写 Huihui** ——
    # 系统默认可能是英文音色，读中文会非常怪。
    # ⚠️ 这个音色名**两条路线不一样**，别混用（2026-10-09 实测踩到）：
    #
    #   本地 windows  -> SAPI 的名字，如 Microsoft Huihui Desktop
    #   云端 openai   -> **模型名:音色名**，如 FunAudioLLM/CosyVoice2-0.5B:alex
    #
    # 实测（直接打 API）：
    #     voice="alex"                              -> 400 Invalid voice (code 20047)
    #     voice="FunAudioLLM/CosyVoice2-0.5B:alex"  -> 200，17407 字节
    #     voice 不传                                 -> 400 "Voice or reference audio should be set"
    #
    # 也就是说云端**必须**带上模型前缀。可选音色见硅基流动文档（alex / benjamin / david…）。
    # 云端音色：**必须写成 `模型名:音色名`**（只写 alex 会 400 Invalid voice）
    # 本地音色（SAPI 名字）。**和上面分开存** —— 两条路线格式不同，
    # 共用一个字段会互相污染（切本地保存后云端就 400 了）。
    rate: 0                      # -10..10，语速。0 是正常
    # 音量（0..100）：**播放端增益**，不是合成参数。
    # 为什么放播放端：edge 的 volume 是 '+10%' 字符串、SAPI 是 0..100 整数、
    # 云端压根没这个参数 —— 三套单位，只有在播放时乘一个系数才都听话。
    volume: 100
    script: ""
    # ---- openai 路线 ----
    #
    # 硅基流动的 CosyVoice2（音质比 SAPI 好很多，但要联网、返回 MP3 无口型）
    model: FunAudioLLM/CosyVoice2-0.5B
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
  vision:
    # ⚠️ **默认关闭**（用户要求：「改成默认关闭」）。
    #
    # 这里显式写出来，而不是靠代码兜底 —— 排查时"配置里看得见"比
    # "只有读代码才知道默认值是什么"可靠得多。
    # 设置页那个开关（`#vision`）读的就是这一项；改这里或点开关都会生效。
    enabled: false
    # none = 不看屏幕（默认，最保守）；pillow = 真实截屏（需要 Pillow）
    provider: none
    # 2026-10-18：20 -> 90。实测一次看图要 12~19 秒，20 秒一次等于一直占着请求；
    # 视觉本来就该慢慢看，不是监控。画面没变化时还会自动拉长到 4 倍。
    interval_s: 90
    # 变化判定阈值（64 位指纹的汉明距离）。调高更迟钝也更省钱；
    # 实测在看视频/滚代码时 8~12 会比较安静。
    change_threshold: 5
    max_edge_px: 768            # 送给视觉模型前把截图长边压到这个尺寸（省 token 的关键）
    include_titles: true        # 顺带取窗口标题 —— 零成本的语义线索
    idle_backoff_max: 4
    content_timeout_s: 20       # 单次内容抽取的超时；超时就只用窗口标题

    # 内容抽取链：按成本从低到高，凑够内容就停。默认顺序刻意保守 —— 默认不烧钱。
    #   title  窗口标题，零成本，永远可用
    #   ocr    本地 OCR，免费但需要装 tesseract（没装会被自动跳过）
    #   vlm    视觉模型，唯一能真看懂画面的，按量计费
    content_order: [title, ocr, vlm]
    ocr_language: chi_sim+eng

    # 视觉模型配置。留空则自动从 providers.brain 复用 base_url。
    # 想启用"真看懂画面"：填一个多模态模型名，并设好对应的密钥环境变量。
    #   例：model: qwen-vl-max      配合 DASHSCOPE_API_KEY
    #       model: gpt-4o-mini      配合 OPENAI_API_KEY
    base_url: ""
    model: ""
    api_key_env: ""             # 留空则沿用 providers.brain.api_key_env
    timeout_s: 30

# ── 「截图对话」（2026-10-17 用户要求）──
#
# 用户原话：
#   「帮我在菜单加个截图对话按钮，这是用户主动截图和聊天的功能，
#     点击按钮或者按下快捷键，屏幕将自动截图并发给ai，接受图片后，
#     玩伴的注意力会直接被拉到好奇状态，玩伴会顺着图片和用户聊天。」
#
# ⚠️ 这段与 `providers.vision`（后台看屏幕）**是两套东西**：
#
#     vision      宠物自己持续看（默认关闭，见上面的 enabled: false）
#     screenshot  用户主动按 Ctrl+Alt+S / 点菜单 -> 抓一张 -> 看懂 -> 开口
#
# 所以这里**不读 vision.enabled**：那个开关的语义是"别自己偷偷看"，
# 而按按钮是用户明确说"看这个"。
#
# ⚠️ 但 `privacy:` 黑名单**仍然生效**（密码 / 银行 / 网银…）——
#    那是"绝不能送出去"，不是意愿开关。命中时会明确告诉你被挡住了。
screenshot:
  enabled: true
  # 送给模型前把长边压到这个尺寸。直接决定 token 与耗时：
  #   768  -> 约 90 KB 的 PNG，实测 1.3~6 秒
  #   1024 -> 更清楚，但慢一倍
  max_edge_px: 768
  # 留空 = 复用 `providers.brain` 当前生效的那一家。
  #
  # 🔴 2026-10-17 实测：`deepseek-flash` **本来就支持图片输入**，
  #    所以默认不需要再配一个视觉供应商。想换（例如用硅基流动的 Qwen-VL）：
  #      base_url: https://api.siliconflow.cn/v1
  #      model: Qwen/Qwen3-VL-30B-A3B-Instruct
  #      api_key_env: SILICONFLOW_API_KEY     # 或填进设置页的密钥库
  base_url: ""
  model: ""
  api_key_env: ""
  # 🔴 **看图必须关掉思考模式**（默认 false，别改成 true）
  #
  # 实测（同一张图、同一个模型）：
  #     max_tokens=200,  thinking 不传      -> 正文 **0 字**（推理吃了 200 token）
  #     max_tokens=1200, thinking 不传      -> 正文 144 字，推理 960 token，6.2 秒
  #     max_tokens=400,  thinking disabled  -> 正文 99 字，  推理 0，       1.3 秒
  #
  # 第一行**不报错**，只是正文是空的 —— 表现像"模型看不了图"，
  # 实际是思考把 token 吃完了。这是本项目栽过的同一个坑（见 prompts.extract 的说明）。
  thinking: false
  max_tokens: 400
  timeout_s: 45
  # 隐私黑名单是否生效。**建议保持 true**。
  respect_privacy: true
  # 看懂之后立刻开口（false = 只把图看懂了，等用户自己说话）
  auto_speak: true
  # 看懂之后，在那一次回复的**末尾另起一段**念出"它实际看到了什么"。
  # 默认关（设置页 → 屏幕 → 勾上即可）。用途是核对它有没有看错：
  #
  #   「诶，你在 Steam 商店页看《活性物质》呀…
  #
  #    （补一句，我刚才看到的是：用户正在使用 Steam 客户端浏览游戏商店页面…）」
  #
  # ⚠️ 这一段只出现在**发出去的那条消息**里，不写进对话历史 ——
  #    写进去会被记忆摘走，之后每一轮它都可能把这句复述一遍。
  show_description: false

# 隐私规则：**在任何分析之前**先判断这一帧能不能看，命中即丢弃。
# 默认就带一批保守项。宁可多跳过，也不要某天发现宠物把密码管理器截走了。
privacy:
  enabled: true
  title_patterns:               # 窗口标题命中即跳过（大小写不敏感的子串匹配，不是正则）
    - 密码
    - password
    - 1password
    - bitwarden
    - lastpass
    - 银行
    - 网银
    - 支付宝
    - 微信支付
    - paypal
    - 私密
    - 无痕
    - incognito
    - 远程桌面
  process_patterns: []          # 前台进程名命中即跳过（可选）
  mode: skip

# 长期记忆（P2）。让宠物记住你说过的重要事情。默认开启。
# 隐私说明：写入前有敏感度过滤（密钥/密码/证件号一律不落盘），你可以随时删除数据库文件清空它。
#
# ⚠️ 2026-10-05 起，记忆从 JSONL 换成 **SQLite 数据库**（`store.py`）。
#    为什么换：用户要"原文全量永久保留 + 珍藏记忆 + 时间窗口注入 + 按标签分类"，
#    JSONL 做这些要么全文件扫描、要么没有事务。SQLite 是标准库，仍然零依赖。
memory:
  enabled: true
  # 数据库落点。auto = 项目内 apps/desktop/pet-data/memory/pet.db
  # （用户要求"记忆全部保留在本地项目"；也避开用户目录可能不可写的问题）
  path: auto
  # 中文全文检索扩展 simple.dll。auto = 从启动时的 cwd 推导
  # （sidecar 启动时会把 cwd 设成它的所在目录，cppjieba 用相对路径找词典）
  simple_dll: auto
  max_items: 2000             # 检索记忆层的条数上限，超出按"重要度 + 使用次数 - 时间衰减"淘汰
  # 向量路的**地板**相似度：低于它的连候选都不算。
  #
  # ## ⚠️ 它是"地板"，不是"闸门"（2026-10-05 换 bge 时重新理解）
  #
  # 一开始我把它当成**硬闸门**（标定出一个"最优阈值"），结果实测发现那样是错的：
  #
  #     查询「他最近在忙什么」
  #       用户在做桌面宠物项目   0.372   <- **正确答案排第 1，却被 0.40 卡掉**
  #       用户通常凌晨两点多睡   0.403   <- 误报，反而过了
  #
  # 单一阈值在这个查询上**不可分**。而且后来还试过**相对判据**
  # （最高分/中位数 > X），实测**更差**：
  #
  #     相关 P10 = 1.243    无关 P90 = 1.608     <- 重叠比绝对阈值还严重
  #
  # 因为正确答案本身可能就不高（0.403，中位 0.324，比值仅 1.24）。
  #
  # ## 0.40 是怎么定的（`tools/calibrate-relative-floor.py` 实测）
  #
  # 关键是看**每个阈值下返回多少条**，而不只看召回率：
  #
  #     阈值   相关:平均返回  相关:正确在里  无关:平均返回
  #     0.25        8.2         8/8         7.6     <- 等于没过滤
  #     0.35        4.8         7/8         1.8
  #     0.40        1.8         5/8         0.1     <- **噪音基本消失**
  #     0.50        0.5         3/8         0.0     <- 漏太多
  #
  # 0.40 把无关返回从 **7.6 条压到 0.1 条**，代价是 8/8 -> 5/8。
  # 而漏掉的那 3 个查询，**正确答案本来就排在错的后面** ——
  # 返回它并不能帮到模型，反而把提示词塞满。
  #
  # ⚠️ 结论：**没有哪个阈值是"正确"的**，两个分布本质重叠。
  #    0.40 是"噪音换召回"上性价比最好的那个点，不是"分对了"。
  #    换 embedding 实现时必须重标定。
  min_score: 0.40             # 检索至少要多像才算相关（太低会让它说出莫名其妙的联想）
  top_k: 5
  duplicate_score: 0.92       # 近似重复不再单独存，而是合并并提升权重
  snippet_chars: 120

  # ---- 专有名词兜底（§114 改动 4，2026-10-20 接入）----
  #
  # 语义 + 关键词两路都**对专有名词不敏感**：
  #   · 分词不认识"银松镇"，FTS 退化成 `"银" AND "松" AND "镇"`，真正那条被挤掉；
  #   · 向量分不清"银松镇"和"明日方舟"（都是游戏名）。
  # 所以在两路之外，再从问句里抽专有名词做**字面子串**匹配，命中就进候选。
  #
  # ⚠️ 关掉它的唯一用途是**做对照实验**（同一批问句开关对比）。
  #    关掉 = 回到 2026-10-20 之前的行为。
  lexical_fallback: true
  lexical_max_terms: 6        # 一句话最多拿几个专有名词去匹配（每个一次全表 LIKE，约 5ms）

  # ---- 泛问句兜底（2026-10-20）----
  #
  # 用户问「我在玩什么游戏」「我喜欢什么」这类**泛问**时，三条检索路全部落空：
  #   · 分词后全是虚词，FTS 匹配不到；
  #   · 抽不出专有名词（"什么游戏"不是名词），词法兜底帮不上；
  #   · 向量也不像 —— "我在玩什么"是疑问句，与"用户在玩《明日方舟》"的陈述句
  #     相似度只有 0.2x，低于 min_score。
  #
  # 结果是：库里明明有那条记忆，它却说"我不太清楚你在玩什么"。**比记错更伤。**
  #
  # 所以加上这一条：**只在全部落空时**，按时间取最近几条端给模型，
  # 并在提示词里明说"这几条未必相关，只在确实对得上时才提"。
  #
  # ⚠️ 只对**泛问**生效（含"什么/哪些/啥"且不含专有名词）。
  #    「那个 C_Thru 插件怎么配」虽然也落空，但那是**真的没有**，
  #    正确回答是"我不知道"，不该端无关记忆上去胡说。
  #
  # 关掉 = 回到 2026-10-20 之前的行为（泛问一律召回不到）。
  general_fallback: true

  keep_utterances: true       # false = 只记提炼出的事实，不记原话（更省更私密）
  profile_max: 30
  extract_timeout_s: 20

  # ---- 记忆压缩（schema v3，2026-10-05 用户指定）----
  #
  # 解决的**不是体积**，是**重复性挤占召回**：
  # 同一条琐事的多种说法各占一个 top_k 名额，把真正相关的那条挤下去。
  # 实测（`tools/measure-hint-size.py`）：注入的 120 轮里只有 39 轮不同，
  # 重复占 68%（同一句出现 17 次）—— 约 9981 token，占 DeepSeek 上限的 15%。
  #
  # ⚠️ 压缩**不删任何数据**，只把"非代表条"标记成 `merged_into` 指向代表条；
  # 被标记的不参与检索（A 方案），但可在记忆压缩页一键还原。
  compress:
    # 相似度阈值：**0.5 ~ 1.0**（用户指定可改，界面上是输入框）
    #
    # ⚠️ 0.75 是实测的甜点（`check-compress-detect.py`，历史实测脚本）：
    #     0.70 / 0.75 -> 琐事组识别 5/5，真实库条目零误聚
    #     0.80        -> 太严，情绪类碎成两两对，只识别 4/5
    #
    # ⚠️ 但**单一阈值分不干净**：「用户在学 Rust」vs「用户使用 Electron 开发」
    #    相似度 0.772 —— 都是编程话题，向量上就是近，但它们是不同的事实。
    #    所以还要靠 `min_group`（组大小）这个辅助判据。
    similarity: 0.75

    # 「检索重复信息 ≥ N」才认为是值得压缩的一组（用户指定的命名）
    #
    # ⚠️ 为什么需要它：真的"常说的话"会反复出现（≥3 条成组），
    #    而两件无关的事偶尔相似只形成**大小 2 的对**。
    #    实测：真实库里最像的一对（学 Rust / 用 Electron）只形成大小 2 的簇。
    min_group: 3

    # manual = 只在界面上列候选，由用户勾选
    # auto   = 相似度达标就自动压（⚠️ 会误合，慎用）
    # ai     = 交给大模型合并成一条更完整的
    mode: manual

    # AI 合并的自定义提示词。留空则用内置默认。
    # 用户要求：「可以让用户自己写提示词让 ai 处理压缩数据」
    prompt: ""

    # ---- AI 压缩的费用提示（用户 2026-10-05 要求）----
    #
    # 用户原话：「ai 压缩的话，需要进行对应的**确认提示弹窗**哦，
    # 不然 api 余额蒸发还不知道干什么了，还要在 ai 压缩里面写个提示，
    # **压缩多少多少文本需要多少 token**，将现在的 deepseek 的
    # **峰谷价格和峰值价格**给用户看，**再换算成实际价格**给用户，
    # 让用户自己对比价格」
    #
    # ⚠️ 价格**会变**，所以全部放在配置里，不写死在代码里。
    #    核对地址：https://api-docs.deepseek.com/quick_start/pricing/
    #    最后核对日期：2026-10-05
    pricing:
      # 官方列的模型名。⚠️ 请求名与实际计费模型可能不同（见上面 provider 的说明）
      model: deepseek-flash
      # 官方价格单位是**美元/百万 token**
      currency: USD
      # 美元兑人民币。⚠️ 汇率会浮动，用户可自行更新
      usd_to_cny: 6.7

      # 输入：缓存未命中（首次跑基本都是未命中）
      input_miss_peak: 0.30
      input_miss_offpeak: 0.15
      # 输入：缓存命中（同一批数据短时间内重跑才会命中）
      input_hit_peak: 0.006
      input_hit_offpeak: 0.003
      # 输出（含思考 token —— deepseek-flash **默认开思考模式**，实测
      # max_tokens=200 时思考占了 81 个 token，照样计费）
      output_peak: 1.2
      output_offpeak: 0.6

      # 高峰时段（**北京时间**）。官方原文是 UTC 01:00-04:00 与 06:00-10:00，
      # 周一至周五，排除中国法定节假日；其余（含周末与节假日全天）为空闲，
      # 空闲价是高峰价的一半。
      peak_hours:
        - [9, 12]
        - [14, 18]

      # 每次合并预计的输出 token 数（用于**估算**要给用户看的费用）。
      # 实测一组 4 条约 92（含思考）~10（不含）token；留足余量取 200。
      # ⚠️ 这只是估算 —— 真实费用以 API 返回的 usage 为准。
      est_output_tokens_per_group: 200
  # ── 最近记忆：按**时间窗口**整段注入（不提炼、不走检索）──
  # ────────────────────────────────────────────────────────────────────────
  # ⚠️ 「最近记忆（时间窗口 N 天）」已于 2026-10-08 **彻底删除**
  # ────────────────────────────────────────────────────────────────────────
  #
  # 用户要求：
  #
  #   「如果能不靠本地的最近记忆来让重启的 api 得到之前的上下文，那也不必
  #     保留最近记忆了」
  #   「最近记忆就不用重复输入了，让 ai 自己靠上下文记住，而这个参数设置
  #     可以替换掉最近记忆的天数，把它改成可记忆设置的上下文 token 吧」
  #
  # **能做到**（`raw_log` 就是逐字原文的永久底本），所以整块删掉：
  #
  #   删掉的键                        原来干什么
  #   ─────────────────────────────  ──────────────────────────────────────
  #   recent_window_days             时间窗口（天）
  #   recent_window_min_days         窗口下限
  #   recent_window_max_days         窗口上限
  #   recent_inject_limit            每次注入多少轮
  #
  # 替换它的是 **providers.brain.history_token_budget** ——
  # 最近对话改走 messages（见 Conversation.bootstrap_history()），
  # 用 token 预算控制发多少，而不再注入 system 提示词。
  #
  # 为什么删而不是留着：实测那段注入占注入体积 **98%**（120 轮 / 10055 token），
  # 而且**与 messages 里的历史重复** —— 那正是「你说了两遍」的成因。
  # 留着死键会让下一个人以为它还有用。
  #
  # ── 灌回历史时要跳过的文本（见 `Gateway._bootstrap_skip_texts`）──
  #
  # ⚠️ 为什么需要这个（2026-10-08）
  #
  # 排查「文本发了两次」那个 bug 的那段时间，宠物每轮都在回「你又说两遍啦」
  # —— 那 40 多条**污染对话已经写进 `raw_log`** 了。
  #
  # 而 `raw_log` 的约定是**永不删除**（用户明确要求"逐字原文永久保留"），
  # 所以不能删。但把它们当正常历史灌回去，模型会**继续**那个话题 ——
  # 用户会发现宠物莫名其妙还在说"你又说两遍"。
  #
  # 所以这里列出来：**不删数据，但不让它污染当下的对话**。
  bootstrap_skip: []
  # ══════════════════════════════════════════════════════════════════════════
  # 灌回历史的天数窗口（用户 2026-10-08 定的设计）
  # ══════════════════════════════════════════════════════════════════════════
  #
  # 用户原话：
  #
  #   「不如直接按照最近记忆，设置多少天的记忆内容，重启宠物时灌注最近的
  #     设置记忆内容即可，不过最近记忆可以按照设置的天数自动搜索数据库取得
  #     字数，计算出总 token 消耗，再和云端的大模型上下文计算，看总占比。」
  #
  # 也就是回到「按天」这个直观的单位，但增加了**量化反馈**：
  #
  #   天数（这个键）      -> 决定**取多少**
  #   brain 的 token 预算 -> 决定**最多发多少**（安全上限）
  #   厂商的 context_window -> 用来算**占比**
  #
  # 设置页会实时显示「窗口内共 X 字 / ≈Y token / 占预算 Z% / 占窗口 W%」，
  # 让用户能看着数字调天数，而不是盲调。
  #
  # ## ⚠️ 两个上限的分工（用户已确认：「天数为主，预算当安全上限」）
  #
  #   天数取的量 **≤ 预算** -> 全发
  #   天数取的量 **> 预算** -> **只发最新的那部分**，界面明确提示"已截断"
  #
  # 预算**不参与"取多少"的决策**，只在最后截一道。这样"天数"保持直观
  # （我要最近 7 天），而预算保证不会因为天数开太大而把请求撑爆。
  #
  # ## ⚠️ 这个键取代了 `recent_window_days`（已删除）
  #
  # 旧的 `recent_window_days` 也是"天数"，但它的用途是**提示词注入**
  # （那段占注入体积 98%、还与 messages 重复的东西，已整体删除）。
  # 这个新键的用途是**灌回对话历史**（走 messages）——
  # 名字刻意不同，免得让人以为"同一个设置只是搬了地方"。
  #
  # 0 = 不限天数（取全部历史，仍受预算截断）
  history_days: 30
  # ── 自动备份：每次启动时把数据库复制到用户指定文件夹 ──
  backup:
    enabled: true            # 用户在设置页开启（或直接选了文件夹，等同开启）
    dir: 'F:\ai项目\apps\desktop\pet-data\backups'   # 备份文件夹（空 = 不备份）
    # 保留最近几份。**0 = 保留全部**（默认）。
    # 为什么默认不限制：实测 119 轮对话的文字只有 6.6 KB，几十份备份也就几百 KB ——
    # 这个量级下"删旧备份"省不下什么，反而可能删掉唯一一份好的。
    # 等 memory_vec 长起来（512 维 ≈ 2 KB/条，2000 条 ≈ 4 MB）再考虑限制。
    keep: 4
  # 文本嵌入。hashing = 内置哈希（零依赖、匹配字面重合）；
  # bge 系列 = 真语义模型（接口已留好，待接 ONNX）。
  embedding:
    # local   = bge-small-zh-v1.5（ONNX）**真语义**，需要 onnxruntime + 模型文件
    # hashing = 零依赖哈希（只有字面重合，不是语义）
    #
    # ⚠️ 2026-10-05 从 hashing 换成 local（用户决定）。
    #    实测差距（`check-bge.py`（历史实测脚本））：
    #      查询「喝咖啡」vs 事实「每天喝一杯冰美式」  0.044 -> 0.549  （零共同字）
    #      查询「熬夜」  vs 事实「凌晨两点多睡」      0.110 -> 0.611
    #    哈希靠字面重合，"换个说法"就彻底失效。
    #
    # ⚠️ **这一条解除了「大脑零第三方依赖」的硬约束**（见 docs 第十八节）：
    #    新增 onnxruntime（约 50MB 运行时）+ 模型 90.5MB。
    #    其余部分（ws_server / 协议 / 记忆库）仍是标准库。
    #
    # 模型没有时会**自动降级为 hashing** 并记 warning（宠物不会因此不说话）。
    provider: local
    dim: 512            # bge-small-zh-v1.5 的 hidden_size。换实现时**不用手改** ——
                        # 嵌入器自己报 dim，维度不符会自动重建向量

# ── 随机事件（2026-10-17，用户列为**重点功能**）──
#
# 用户原话：
#   「不定时的随机事件也写进去，比如：想和用户一起打游戏（后续会做和用户一起打游戏
#     的功能，先留个路口）、大声唱用户喜欢的歌搞怪（后续会做拉起用户音乐app读取
#     喜欢歌曲唱几段歌词的功能，先留个路口）、去网上搜索哲学语句和用户交流体验、
#     去网上观看自己喜欢的小说（后续阅读书籍小说模块会做，先留个路口），
#     做这些事也会相应的增加玩伴对用户的印象、玩伴的情绪变化，把这些记录下来，
#     顺便将随机事件列为重点功能，后面继续添加。」
#
# ⚠️ 事件本身定义在 `apps/brain/pet/events.py` 的 `EVENTS` 里（加事件改那里）。
#    这一段只是**运行参数**。
#
# ⚠️ 「路口」（未实现的未来功能）不在配置里开关，而在 events.py 的
#    `CAPABILITIES` 里：把 `music_app` 改成 True，唱歌事件立刻启用。
events:
  enabled: true
  # 每次 tick（5 秒）抽中的概率。
  # 🔴 这个值看着小，但别按"一次对话"去理解 —— 5 秒抽一次，
  #    0.02 意味着期望约 250 秒抽中一次，再叠加下面的间隔与日上限，
  #    真实频率是**一天几次到十几次**。想调"更活泼"先动 idle_before_s。
  base_chance: 0.02
  # 两次事件之间至少隔多久（秒）。防止连着冒事件。
  min_gap_s: 600
  # 用户安静多久之后它才去做自己的事（秒）。
  # 刚聊完就跑去看小说很出戏 —— 它在等你，不是在敷衍你。
  idle_before_s: 300
  # 一天最多几次。上限的意义：可以有"自己的生活"，
  # 但不能变成"整天在干别的、不理你"。
  max_per_day: 12
  # 安静时段（不做事也不发声）。格式 `[23, 8]` = 23:00 到次日 08:00。
  # ⚠️ 支持跨零点；判断逻辑在 `events.EventEngine.in_quiet_hours`。
  #    留空 `[]` = 不设安静时段。
  quiet_hours: []

# 插件配置段。插件通过 ctx.config 读取自己的那一份。
plugins: {}
