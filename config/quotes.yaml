  - text: 问君能有几多愁，恰似一江春水向东流。
    kind: poem
    source: 李煜

  # ── 经文（道经 / 佛经 / 圣经） ──
  - text: 道可道，非常道；名可名，非常名。
    kind: scripture
    source: 《道德经》

  - text: 上善若水，水善利万物而不争。
    kind: scripture
    source: 《道德经》

  - text: 色即是空，空即是色。
    kind: scripture
    source: 《心经》

  - text: 一切有为法，如梦幻泡影，如露亦如电，应作如是观。
    kind: scripture
    source: 《金刚经》

  - text: 日光之下，并无新事。
    kind: scripture
    source: 《传道书》

  - text: 爱是恒久忍耐，又有恩慈。
    kind: scripture
    source: 《哥林多前书》
