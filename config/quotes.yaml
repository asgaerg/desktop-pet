# 玩伴"觉得好"的句子 —— 「自言自语」档念的就是这里的句子
#
# ## 为什么要有这张表（2026-10-17 用户要求）
#
# 用户原话：
#   「自言自语讲的话来自于一个表里面，这里面会存储玩伴觉得好的句子，比如：
#     我个人认为这个意大利面就应该拌42号混凝土……这类的话，包括小说里面
#     一些经典知名度很广的句子比如：手握日月摘星辰，世间无我这般人，
#     后续看小说功能写好，还能让它自己选着自己喜欢的句子加进去。
#     当然，也可以偶尔讲讲道经 / 佛经 / 圣经 ，其中哲学句子多，不乏古诗。」
#
# 三个要点：
#   ① **表**是内容源：念什么由这里决定，不是让模型自由编（编出来的经文是假的）
#   ② **哲学最多**，古诗也算在里面（用户明确说的）
#   ③ 以后"看小说"功能做好，它会自己往里加喜欢的句子 —— 所以这张表**会变长**，
#      格式要能让程序追加（`quotes:` 是列表，追加就是多一行）
#
# ## 权重怎么理解
#
# `weight` 是**类别**被挑中的相对概率，不是句子的概率。
# 先按权重挑类别，再在类别里等概率挑一句 —— 这样"哲学句子多"有两重效果：
# 权重高 + 条目多。（若只按句子加权，往表里多加 20 句哲学就自动更常念，
# 那是用户想要的效果，所以哲学这一类的条目也应该持续增加。）
#
# ## 加新句子时
#
# ```
#   - text: 句子原文
#     kind: philosophy        # 必须是下面 categories 里有的 kind
#     source: 出处（可省）      # 用户听到好句子会问"哪来的"，有就写上
# ```
# ⚠️ 别往 `text` 里塞换行 —— 一句就是一句，换行会让"念经"变成大段文字。

categories:
  # 胡话 / 网络梗 / 一本正经的胡说八道（用户点名的那类）
  absurd:
    weight: 2
    label: 胡话
  # 小说里知名度很广的句子
  novel:
    weight: 3
    label: 小说名句
  # 哲学 —— 用户要求"最多"的一类
  philosophy:
    weight: 8
    label: 哲学
  # 古诗（用户说"不乏古诗"，算在哲学的氛围里）
  poem:
    weight: 5
    label: 古诗
  # 道经 / 佛经 / 圣经
  scripture:
    weight: 3
    label: 经文

quotes:
  # ── 胡话（用户给的例子，原文照抄） ──
  - text: 我个人认为这个意大利面就应该拌42号混凝土。因为这个螺丝钉的长度，它很容易会直接影响到挖掘机的扭距，你往里砸的时候，一瞬间它就会产生大量的高能蛋白，俗称UFO。会严重影响经济的发展。
    kind: absurd
    source: 用户提供的例子

  - text: 众所周知，水是剧毒的，因为喝过水的人最后都死了。
    kind: absurd

  - text: 如果你把手机倒过来，你会发现它还是正的。
    kind: absurd

  # ── 小说名句（用户给的例子） ──
  - text: 手握日月摘星辰，世间无我这般人。
    kind: novel
    source: 用户提供的例子

  - text: 天地不仁，以万物为刍狗。
    kind: novel
    source: 常用于修真类小说，语出《道德经》

  - text: 我命由我不由天。
    kind: novel

  # ── 哲学（最多的一类） ──
  - text: 一个人只要知道自己为什么而活，就可以忍受任何一种生活。
    kind: philosophy
    source: 尼采

  - text: 我们无法选择自己的处境，但可以选择如何面对它。
    kind: philosophy

  - text: 人生而自由，却无往不在枷锁之中。
    kind: philosophy
    source: 卢梭

  - text: 未经省察的人生不值得过。
    kind: philosophy
    source: 苏格拉底

  - text: 凡是过往，皆为序章。
    kind: philosophy
    source: 莎士比亚《暴风雨》

  - text: 真正的发现之旅不在于寻找新风景，而在于拥有新的眼睛。
    kind: philosophy
    source: 普鲁斯特

  - text: 人不能两次踏进同一条河流。
    kind: philosophy
    source: 赫拉克利特

  - text: 自由的代价是永远的警惕。
    kind: philosophy

  # ── 古诗 ──
  - text: 人生天地间，忽如远行客。
    kind: poem
    source: 《古诗十九首》

  - text: 及时当勉励，岁月不待人。
    kind: poem
    source: 陶渊明

  - text: 沉舟侧畔千帆过，病树前头万木春。
    kind: poem
    source: 刘禹锡

  - text: 山重水复疑无路，柳暗花明又一村。
    kind: poem
    source: 陆游

  - text: 长风破浪会有时，直挂云帆济沧海。
    kind: poem
