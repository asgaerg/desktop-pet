# 书源配置（生效文件）
#
# 格式说明见 `book-sources.example.yaml`。
#
# ============================================================================
# ⚠️ 2026-10-31 实测记录：用户提供的 10 个 Legado 书源里，
#    **只有 1 个真的能用**。其余的死因各有不同，记在这里避免重复踩：
#
#    ✅ 新笔趣阁   www.xbqg777.com     可用（《三体》抓出 4294 字正文）
#    ❌ 速读谷     www.sudugu.org      搜索接口返回 HTTP 500「运行时错误」
#    ❌ 猫眼看书   api.jmlldsc.com     目录接口返回 code=4005「认证失败」（要登录）
#    ❌ 唐三中文   www.xtangsanshu.com 连接超时
#    ❌ 玄幻阁网   www.xuanyge.com     连接超时
#    ❌ 蚂蚁文学   www.mayiwsk.com     连接超时
#    ❌ 手机小说   www.shoujixs.net    HTTP 403（IP 级封锁）
#    ❌ 蕃茄(dzrjk) m.dzrjk.com        HTTP 403（PC 站/手机站/换 UA 全部 403）
#    ❌ 番茄(优+)  fq-book.netsite.cc  协议错误（依赖第三方共享 API，已失效）
#    ⚠️ 七猫/酷我  API 站，返回 0 字节，需要签名参数才通
#    ❌ 番茄小说   fanqienovel.com      搜索✅/目录✅ 但**正文拿不到**
#
#    结论：免费书源寿命很短（这几个源看起来是 2025 年前后整理的）。
#    **遇到失效的直接注释掉，别删** —— 站点有时会回来。
#
# ----------------------------------------------------------------------------
# 🔴 番茄小说：**不要再试了**（2026-10-31 实测，结论明确）
#
#    用户提供过两份番茄书源（Legado 格式），排查结果：
#
#      搜索  api.fanqiesdk.com/.../search/v1    ✅ 200，10 本正版《三体》
#      目录  fanqienovel.com/api/reader/directory/detail  ✅ 200，42 章
#      正文  /api/reader/full、/reading/bookapi/...  ❌ **200 但 0 字节**
#
#    「200 但 0 字节」是签名校验失败的最隐蔽形式 —— 它不报 401/403，
#    而是安静返回空。只看状态码会以为接口正常。
#
#    正文规则依赖 `FQ_cmGet` / `FQ_dev` / `FQ_ensure` 三个自定义函数，
#    书源备注写明了：「x-argus/x-ladon 签名 + CM DH 通道解密」。
#    这是字节跳动的 **App 级风控**，不是网页结构问题。
#
#    突破它需要：逆向签名算法（随版本更新失效）+ 实现 DH 密钥交换 +
#    维护设备池。**这是会持续失效的技术对抗，不属于本项目该做的事。**
#    用户 2026-10-31 也明确说了「算了，不搞这个」。
# ----------------------------------------------------------------------------
# ============================================================================

sources:
  # --------------------------------------------------------------------------
  # 新笔趣阁（实测可用 2026-10-31）
  #
  # 结构：
  #   搜索  GET /search?keyword=xxx      -> .card 列表
  #   书页  /<book_id>                   -> .chapter ol li a 目录
  #   章节  /<book_id>/<num>             -> #article 正文
  #
  # 正文里混着 `<p class="readinline">` 的广告段，必须清掉，
  # 否则会跟着正文一起被读出来。
  # --------------------------------------------------------------------------
  - name: 新笔趣阁
    base: https://www.xbqg777.com/
    enabled: true
    encoding: ''

    search:
      method: get
      path: search
      keyword_field: keyword
      book_link: '/\d+$'

    toc:
      url: '/{book_id}'
      chapter_link: '/\d+/\d+$'

    content:
      selectors:
        - '#article'
      min_chars: 500
      # 正文清洗：去掉广告段和残留标记
      #
      # ⚠️ 这几个正则是**从实测 HTML 里推出来的**（2026-10-31）：
      #    · `<p class="readinline">...` 是站点插的推广段
      #    · `<!--over-->` 是章节结束标记（有的章节有有的没有）
      drop_patterns:
        - '<p[^>]*class="readinline"[^>]*>[\s\S]*?</p>'
        - '<!--over-->'

  # --------------------------------------------------------------------------
  # 思兔阅读（实测可用 2026-10-31，用户推荐）
  #
  # 结构（**和新笔趣阁完全不同，很值得记下来**）：
  #   搜索  GET /search/<关键词>.html      <- 关键词在**路径**里，不是 query 参数
  #   书页  /book/<bookid>.html
  #   目录  /chapter/<bookid>.html         <- 注意：目录和章节同一个前缀
  #   章节  /chapter/<bookid>/<chapid>.html
  #
  # ⚠️ 两个坑：
  #
  #   ① 搜索**不能用 ?searchkey=xxx**。首页表单写的是 action=/search 字段 searchkey，
  #      但直接访问 /search 返回 **HTTP 401（0 字节）**，看起来像要登录。
  #      实际是 Cloudflare 挡的；真正的搜索 URL 是 `/search/<词>.html`。
  #      而 `/search.html`（带 .html）是「热门搜索」页 —— 200 但**不是搜索结果**，
  #      很容易误判成"搜索成功但没这本书"。
  #
  #   ② 正文容器要用 `#content`，**别用 `.book.read` 或 `.content`**：
  #      那两个会把工具栏文字一起带进来 ——
  #      「第三章：脉冲星｜关灯｜字体-｜字体+｜目录｜书签｜报错｜叶哲泰…」
  #      而 `#content` 直接从正文第一句开始。
  # --------------------------------------------------------------------------
  - name: 思兔阅读
    base: https://www.sto66.com/
    enabled: true
    encoding: ''

    search:
      method: get
      # 关键词放路径里：{q} 由程序做 URL 编码后替换
      path: 'search/{q}.html'
      # 关键词已经在 path 里，这里给一个不会被用的名字
      keyword_field: _unused
      book_link: '/book/[A-Za-z0-9]+\.html$'

    toc:
      # {book_id} 从书页 URL 里抽，程序会自动填
      url: '/chapter/{book_id}.html'
      chapter_link: '/chapter/[A-Za-z0-9]+/[A-Za-z0-9]+\.html$'

    content:
      selectors:
        - '#content'
      min_chars: 500

  # --------------------------------------------------------------------------
  # 阅读库（实测可用 2026-10-31，用户推荐）
  #
  # 这是**杰奇 CMS**（JieqiCMS）—— 国内一大批小说站都用它，特征很明显：
  #   书页  /html/<a>/<id>/           （两级数字目录）
  #   章节  /html/<a>/<id>/<cid>.html
  #   书库  /modules/article/articlefilter.php
  #
  # 所以这套配置**能直接套用到其它杰奇站**，只要换 base。
  #
  # ⚠️ 三个坑（都是实测出来的，不看会白折腾）：
  #
  #   ① 搜索参数名是 **`q`**，不是 `searchkey`。
  #      页面 JS（/scripts/theme.js 的 search_pc()）里明明写着
  #      `<input name="searchkey">`，但服务端**只认 `q`**：
  #
  #          searchkey=夜玄 -> 200，"共有 0 条结果"
  #          keyword=夜玄   -> 200，"共有 0 条结果"
  #          q=夜玄         -> 200，"共有 100 条结果"   ← 只有这个能用
  #
  #      我按页面上写的参数名试了三轮全是 0 条，差点判定"搜索被关掉了"。
  #      判断依据是那个「搜索关键词"　"」里的**空引号** ——
  #      说明服务端压根没收到参数，不是真的没结果。
  #
  #   ② 搜索是 **POST**（页面 form 明确写 method="post"），不是 GET。
  #
  #   ③ 书名不在 `<a>` 里。卡片结构是：
  #
  #          <div class="c_row">
  #            <div class="fl"><a href="/book/510881/"><img .../></a></div>
  #            <div><div><span class="c_subject"><a href="/book/510881/">夜玄</a></span>
  #                      / <a href="/html/510/510881/">目录</a></div> ...
  #
  #      第一个 `<a>` 只包封面图（文本为空），书名在**兄弟** span 里，
  #      而 `/book/{id}/` 和 `/html/{a}/{id}/` **都指向这本书**。
  #      所以 `_pick_title` 要能往上走几层找 `.c_subject`。
  #
  #   ④ 正文容器 `#content` 里混了两段站名广告，必须用 drop_patterns 清掉：
  #      开头 `(阅读库www.yeudusk.com)(阅读库 www.yeudusk.com)`
  #      结尾 `阅读库 www.yeudusk.com...如果您中途有事离开，请按 CTRL+D…`
  #      不清的话宠物可能把广告词当情节讲出来。
  # --------------------------------------------------------------------------
  - name: 阅读库
    base: http://www.yeudusk.com/
    enabled: true
    encoding: ''

    search:
      method: post
      path: modules/article/search.php
      # ⚠️ 是 q，不是页面上写的 searchkey（见上面 ①）
      keyword_field: q
      extra:
        searchtype: articlename
        Submit: 搜索
      # 书籍链接：/html/<a>/<id>/  —— 以「/html/数字/数字/」结尾
      book_link: '/html/\d+/\d+/?$'

    toc:
      # ⚠️ 这里**故意不写 url**（留空）。
      #
      # 杰奇 CMS 的书页 `/html/<a>/<id>/` 本身就是完整目录（实测 3710 章都在里面），
      # 没有单独的目录页。而 `toc_url` 的 `{book_id}` 只能替换成**一个数字**
      # （通用正则抽出来是 `510881`），但真实路径要 `510/510881` 两段 ——
      # 拼出来会是 `/html/510881/`，404。
      #
      # 留空后 `chapter_urls` 会自动"退回到直接扫书页"，正是我们要的行为。
      #
      # 代价：书页 1MB / 1.2 秒（3710 章全在里面）。只拉一次，可以接受。
      url: ''
      # 章节：/html/<a>/<id>/<cid>.html
      chapter_link: '/html/\d+/\d+/\d+\.html$'

    content:
      selectors:
        - '#content'
      min_chars: 500
      drop_patterns:
        # 开头的站名广告（出现两次，可能连在一起）
        - '\(阅读库\s*www\.yeudusk\.com\)'
        # 结尾的收藏提示整段
        - '阅读库\s*www\.yeudusk\.com[\s\S]*?CTRL\+D[\s\S]*?以便以后接着观看！'

# ============================================================================
# 阅读行为
# ============================================================================
reading:
  # 空闲多久触发（秒）。用户要的 30 分钟 = 与「安静」档的 idle_after_s 一致。
  #
  # ⚠️ 调试时改成 120 观察过一次，验证完必须改回来 ——
  #    120 秒意味着用户只要两分钟没说话它就去下书，会很吵。
  idle_after_s: 1800
  # 每次抓多少字（约 1500 字中文，够宠物"有点想法"又不至于吃光上下文）
  chunk_chars: 1500
  # 同一本书两次阅读的最小间隔
  same_book_cooldown_s: 7200
  # 一次只抓一章（不整本下，既不礼貌也占空间）
  max_chapters_per_session: 1
  # 正文少于这个字数 = 该源这本书没内容 -> 换源
  min_body_chars: 500
  # 最多试几个源
  max_source_retries: 3

# 随机挑一个去搜。写你真正想看的书。
queries:
  - 三体
  - 诡秘之主
  - 庆余年
  - 雪中悍刀行
  - 凡人修仙传

# ============================================================================
# 社区帖子（小黑盒 / B站）—— 这类不下载，只读网页
# ============================================================================
community:
  enabled: true
  sites:
    - name: 小黑盒
      query_hint: 'site:xiaoheihe.cn'
    - name: B站专栏
      query_hint: 'site:bilibili.com/read'
  topics:
    - '游戏杂谈 趣事'
    - '单机游戏 心得'
    - '最近的游戏新闻 讨论'
  share: true
